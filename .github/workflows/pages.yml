# main'e her birleştirmede oyunu GitHub Pages'te yayınlar: https://gokhan690.github.io/idle-game/
# Bir kez: Settings → Pages → Build and deployment → Source: "GitHub Actions" seçilmeli.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html css js icons manifest.webmanifest sw.js _site/
          cp dist/demir-cephe.html _site/tek-dosya.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
