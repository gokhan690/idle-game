        (incoming > 0
          ? '<div class="pRow"><span class="k">Yolda</span><span class="v num">' + Utils.qty(incoming) + ' ton</span></div>'
          : "") +
        '<div class="pRow"><span class="k">Teslimde ödeme</span><span class="v num up">' + Utils.money(c.value) + '</span></div>' +
        '<div class="pRow"><span class="k">Ceza</span><span class="v num ' + (c.penaltyPaid ? "" : "down") + '">' +
          (c.penaltyPaid ? "ödendi" : "-" + Utils.money(c.penalty)) + '</span></div>' +
      '</div>' +

      note +

      '<div class="mktBtns">' +
        '<button class="btn ghost" data-action="contractCancel" data-id="' + c.id + '">İPTAL</button>' +
        '<button class="btn primary" data-action="contractDeliver" data-id="' + c.id + '"' +
          (ready ? "" : " disabled") + '>' + (ready ? "TESLİM ET" : Utils.qty(need) + " TON EKSİK") + '</button>' +
      '</div>' +
    '</div>';
  },

  /* ---------------- screen: TİCARET ---------------- */
  renderTrades() {
    const s = GameState.data;
    const seg = this.tradeSegment;
    const urgent = ContractSystem.urgentCount();

    const inTransit = s.purchaseOrders.length;
    let html = '<div class="seg four">' +
      '<button class="segBtn' + (seg === "offers" ? " active" : "") + '" data-action="seg" data-seg="offers">' +
        'Fırsat' + (s.offers.length ? '<span class="n">' + s.offers.length + '</span>' : "") + '</button>' +
      '<button class="segBtn' + (seg === "active" ? " active" : "") + (urgent ? " alert" : "") +
        '" data-action="seg" data-seg="active">' +
        'Aktif' + (s.contracts.length ? '<span class="n">' + s.contracts.length + '</span>' : "") + '</button>' +
      '<button class="segBtn' + (seg === "supply" ? " active" : "") + '" data-action="seg" data-seg="supply">' +
        'Tedarik' + (inTransit ? '<span class="n">' + inTransit + '</span>' : "") + '</button>' +
      '<button class="segBtn' + (seg === "history" ? " active" : "") + '" data-action="seg" data-seg="history">' +
        'Geçmiş</button>' +
    '</div>';

    if (seg === "offers") {
      html += '<div class="sectionTitle"><h2>Gelen Talepler</h2>' +
        '<span class="hint">' + ContractSystem.activeCount() + ' / ' + ContractSystem.maxActive() + ' sözleşme</span></div>';
      html += s.offers.length
        ? s.offers.map((o) => this.offerCardHTML(o)).join("")
        : '<div class="empty"><div class="ic">📨</div>' +
          '<div class="t">Şu an açık talep yok</div>' +
          '<div class="s">Müşteriler günler ilerledikçe teklif gönderir. İtibarın yükseldikçe daha sık ve daha büyük siparişler gelir.</div></div>';

    } else if (seg === "active") {
      html += '<div class="sectionTitle"><h2>Aktif Sözleşmeler</h2>' +
        '<span class="hint">' + ContractSystem.activeCount() + ' / ' + ContractSystem.maxActive() + '</span></div>';
      html += s.contracts.length
        ? s.contracts.slice().sort((a, b) => {
            const ao = a.status === "overdue" ? -1 : 0, bo = b.status === "overdue" ? -1 : 0;
            return (ao - bo) || (a.daysLeft - b.daysLeft);
          }).map((c) => this.contractCardHTML(c)).join("")
        : '<div class="empty"><div class="ic">📋</div>' +
          '<div class="t">Aktif sözleşmen yok</div>' +
          '<div class="s">Fırsatlar sekmesinden bir talebi kabul et.</div>' +
          '<button class="btn primary sm" style="margin-top:14px;max-width:220px;margin-left:auto;margin-right:auto" data-action="seg" data-seg="offers">FIRSATLARA BAK</button></div>';

    } else if (seg === "supply") {
      html += this.procurementHTML();

    } else {
      html += '<div class="statGrid">' +
        '<div class="statBox"><div class="k">Tamamlanan</div><div class="v num">' + Utils.qty(s.stats.contractsDone) + '</div></div>' +
        '<div class="statBox"><div class="k">Kaçırılan</div><div class="v num ' +
          (s.stats.contractsFailed ? "down" : "") + '">' + Utils.qty(s.stats.contractsFailed) + '</div></div>' +
        '<div class="statBox"><div class="k">Sözleşme Cirosu</div><div class="v num">' + Utils.money(s.stats.contractRevenue) + '</div></div>' +
        '<div class="statBox"><div class="k">Ödenen Ceza</div><div class="v num ' +
          (s.stats.penaltiesPaid ? "down" : "") + '">' + Utils.money(s.stats.penaltiesPaid) + '</div></div>' +
        '<div class="statBox"><div class="k">Tedarik Siparişi</div><div class="v num">' + Utils.qty(s.stats.poCount) + '</div></div>' +
        '<div class="statBox"><div class="k">Tedarikten Alınan</div><div class="v num">' + Utils.qty(s.stats.poTons) + ' ton</div></div>' +
        '<div class="statBox"><div class="k">Tedariğe Harcanan</div><div class="v num">' + Utils.money(s.stats.poSpent) + '</div></div>' +
      '</div>';

      if (s.contractLog.length) {
        html += '<div class="sectionTitle" style="margin-top:16px"><h2>Sözleşme Geçmişi</h2></div>';
        html += s.contractLog.map((e) => {
          const p = GameState.product(e.product);
          const good = e.result === "done";
          const label = e.result === "done" ? "Teslim edildi"
            : e.result === "late" ? "Geç teslim"
            : e.result === "cancelled" ? "İptal edildi" : "Kaçırıldı";
          const icon = good ? "✓" : e.result === "late" ? "!" : "✕";
          const cls = good ? "sell" : e.result === "late" ? "upg" : "buy";
          return '<div class="txRow">' +
            '<div class="txIcon ' + cls + '" style="' + (good ? "" : e.result === "late" ? "" : "background:rgba(255,92,124,.14);color:#FF8FA6") + '">' + icon + '</div>' +
            '<div class="txMain"><div class="txTitle">' + Utils.escape(e.customer) + '</div>' +
            '<div class="txSub num">Gün ' + e.day + ' · ' + Utils.qty(e.qty) + ' ton ' + (p ? p.name : "") + ' · ' + label + '</div></div>' +
            '<div class="txAmt">' +
              '<div class="a num ' + (good || e.result === "late" ? "up" : "down") + '">' +
                (e.result === "done" || e.result === "late" ? "+" + Utils.money(e.value) : "-" + Utils.money(e.penalty)) + '</div>' +
              '<div class="b num ' + (e.rep >= 0 ? "up" : "down") + '">' + (e.rep >= 0 ? "+" : "") + e.rep + ' itibar</div>' +
            '</div>' +
          '</div>';
        }).join("");
      }

      html += '<div class="sectionTitle" style="margin-top:16px"><h2>İşlem Geçmişi</h2>' +
        '<span class="hint">' + Utils.qty(s.stats.totalTrades) + ' işlem</span></div>';
      html += this.txHistoryHTML();
    }

    $("#screenTrades").innerHTML = html;
  },

  /* ---------------- bileşen: tedarik ekranı ---------------- */
  fitLineHTML(fit, leadLabel) {
    if (fit.state === "none") return "";
    const c = fit.contract;
    const head = Utils.escape(c.customer) + " · " + Utils.qty(c.qty) + " ton · " + this.deadlineText(c);
    if (fit.state === "ok") {
      return '<div class="fitLine ok">✓ En yakın sözleşmeye yetişir · ' + head + '</div>';
    }
    if (fit.state === "grace") {
      return '<div class="fitLine grace">Telafi süresine yetişir · geç teslim olur · ' + head + '</div>';
    }
    return '<div class="fitLine late">⚠ En yakın sözleşmeye yetişmez · ' + head + '</div>';
  },

  procurementHTML() {
    const s = GameState.data;
    const pid = this.procProduct;
    const p = GameState.product(pid) || CONFIG.PRODUCTS[0];
    const market = GameState.price(p.id);
    let html = "";

    // Yoldaki siparişler
    if (s.purchaseOrders.length) {
      html += '<div class="sectionTitle"><h2>Yoldaki Siparişler</h2>' +
        '<span class="hint">' + Utils.money(GameState.inTransitValue()) + '</span></div>';
      html += s.purchaseOrders.slice().sort((a, b) => a.daysLeft - b.daysLeft).map((o) => {
        const op = GameState.product(o.product);
        const prog = o.leadTime > 0 ? (o.leadTime - o.daysLeft) / o.leadTime : 1;
        return '<div class="poCard">' +
          '<div class="poTop">' + this.productIcon(op) +
            '<div style="flex:1;min-width:0"><div class="poName">' + Utils.escape(o.supplierName) + '</div>' +
            '<div class="poSub num">' + Utils.qty(o.qty) + ' ton ' + op.name + ' · ' + Utils.price(o.unitPrice) + '/ton</div></div>' +
            '<div style="text-align:right"><div class="lead' + (o.daysLeft <= 1 ? " fast" : "") + '">' +
              o.daysLeft + ' GÜN</div>' +
              '<div class="poSub num" style="margin-top:4px">' + Utils.money(o.totalCost) + '</div></div>' +
          '</div>' +
          '<div class="poBar"><div class="poFill" style="width:' + (prog * 100).toFixed(1) + '%"></div></div>' +
        '</div>';
      }).join("");
    }

    // Ürün seçici
    html += '<div class="sectionTitle" style="margin-top:' + (s.purchaseOrders.length ? "18px" : "2px") + '">' +
      '<h2>Tedarik Kaynakları</h2><span class="hint">Kullanılabilir ' +
      Utils.qty(GameState.availableCapacity()) + ' ton</span></div>';
    html += '<div class="pSel">' + CONFIG.PRODUCTS.map((pr) =>
      '<button class="pBtn' + (pr.id === p.id ? " active" : "") + '" data-action="procProduct" data-id="' + pr.id + '">' +
        '<span class="t">' + pr.name + '</span>' +
        '<span class="p num">' + Utils.price(GameState.price(pr.id)) + '</span></button>').join("") + '</div>';

    // Spot piyasa (anında teslim, referans kaynak)
    const spotMax = TradingSystem.maxBuy(p.id);
    html += '<div class="supCard spot">' +
      '<div class="supHead">' +
        '<div style="flex:1;min-width:0"><div class="supName">Spot Piyasa</div>' +
        '<div class="supDesc">Anında teslim · min 1 ton</div></div>' +
        '<span class="lead fast">ANINDA</span>' +
      '</div>' +
      '<div class="supPrice"><span class="v num">' + Utils.price(market) + '</span>' +
        '<span class="u">/ton</span><span class="dlt flat">referans</span></div>' +
      '<div class="ctrRows previewBox" style="margin:9px 0 0;border:0;background:transparent;padding:0">' +
        '<div class="pRow"><span class="k">Şu an alınabilir</span><span class="v num">' + Utils.qty(spotMax) + ' ton</span></div>' +
      '</div>' +
      '<div class="mktBtns">' +
        '<button class="btn primary" data-action="buy" data-id="' + p.id + '"' + (spotMax > 0 ? "" : " disabled") + '>' +
          'SPOTTAN AL</button>' +
      '</div>' +
    '</div>';

    // Tedarikçiler (ucuzdan pahalıya)
    const list = ProcurementSystem.suppliersFor(p.id).slice().sort((a, b) => {
      const qa = ProcurementSystem.quote(a.id, p.id), qb = ProcurementSystem.quote(b.id, p.id);
      return (qa === null ? 1e9 : qa) - (qb === null ? 1e9 : qb);
    });

    html += list.map((sup) => {
      const price = ProcurementSystem.quote(sup.id, p.id);
      if (price === null) return "";
      const delta = ProcurementSystem.delta(sup.id, p.id);
      const max = ProcurementSystem.maxOrder(sup.id, p.id);
      const canOrder = max >= sup.minQty;
      const fit = ProcurementSystem.contractFit(p.id, sup.leadTime);

      let blocker = "";
      if (!canOrder) {
        const need = sup.minQty;
        blocker = (GameState.availableCapacity() < need)
          ? '<div class="warnLine">Minimum sipariş için ' + Utils.qty(need - GameState.availableCapacity()) +
            ' ton daha boş alan gerekiyor</div>'
          : '<div class="warnLine soft">Minimum ' + Utils.qty(need) + ' ton için ' +
            Utils.money(need * price - GameState.data.cash) + ' daha nakit gerekiyor</div>';
      }

      return '<div class="supCard">' +
        '<div class="supHead">' +
          '<div style="flex:1;min-width:0"><div class="supName">' + Utils.escape(sup.name) + '</div>' +
          '<div class="supDesc">' + Utils.escape(sup.desc) + ' · min ' + Utils.qty(sup.minQty) + ' ton</div></div>' +
          '<span class="lead ' + (sup.leadTime <= 1 ? "fast" : sup.leadTime >= 4 ? "slow" : "") + '">' +
            sup.leadTime + ' GÜN</span>' +
        '</div>' +
        '<div class="supPrice"><span class="v num">' + Utils.price(price) + '</span>' +
          '<span class="u">/ton</span>' +
          '<span class="dlt ' + (delta > 0.0005 ? "up" : delta < -0.0005 ? "" : "flat") + '">' +
            Utils.pct(delta) + ' spot</span></div>' +
        '<div class="ctrRows previewBox" style="margin:9px 0 0;border:0;background:transparent;padding:0">' +
          '<div class="pRow"><span class="k">Şu an alınabilir</span><span class="v num">' + Utils.qty(max) + ' ton</span></div>' +
          (canOrder
            ? '<div class="pRow"><span class="k">' + Utils.qty(sup.minQty) + ' ton maliyeti</span>' +
              '<span class="v num">' + Utils.money(sup.minQty * price) + '</span></div>'
            : "") +
        '</div>' +
        this.fitLineHTML(fit, sup.leadTime) +
        blocker +
        '<div class="mktBtns">' +
          '<button class="btn primary" data-action="poOpen" data-sup="' + sup.id + '" data-id="' + p.id + '"' +
            (canOrder ? "" : " disabled") + '>SİPARİŞ VER</button>' +
        '</div>' +
      '</div>';
    }).join("");

    // Son teslim alınanlar
    if (s.purchaseHistory.length) {
      html += '<div class="sectionTitle" style="margin-top:18px"><h2>Teslim Alınanlar</h2></div>';
      html += s.purchaseHistory.slice(0, 6).map((o) => {
        const op = GameState.product(o.product);
        return '<div class="txRow">' +
          '<div class="txIcon buy">↓</div>' +
          '<div class="txMain"><div class="txTitle">' + Utils.escape(o.supplierName) + '</div>' +
          '<div class="txSub num">Gün ' + (o.deliveredDay || o.orderedDay) + ' · ' + Utils.qty(o.qty) + ' ton ' +
            (op ? op.name : "") + ' @ ' + Utils.price(o.unitPrice) + '</div></div>' +
          '<div class="txAmt"><div class="a num">' + Utils.money(o.totalCost) + '</div>' +
          '<div class="b muted3">teslim</div></div>' +
        '</div>';
      }).join("");
    }

    return html;
  },

  /* ---------------- bileşen: alım/satım geçmişi ---------------- */
  txHistoryHTML() {
    const s = GameState.data;
    if (!s.transactions.length) {
      return '<div class="empty"><div class="ic">🧾</div>' +
        '<div class="t">Henüz işlem yok</div>' +
        '<div class="s">İlk alışını yaptığında burada listelenecek.</div></div>';
    }
    return s.transactions.map((t) => {
      if (t.type === "upgrade") {
        return '<div class="txRow">' +
          '<div class="txIcon upg">↑</div>' +
          '<div class="txMain"><div class="txTitle">Depo geliştirildi</div>' +
          '<div class="txSub">Gün ' + t.day + ' · Seviye ' + t.level + ' · ' + Utils.qty(t.capacity) + ' ton</div></div>' +
          '<div class="txAmt"><div class="a num down">-' + Utils.money(t.total) + '</div>' +
          '<div class="b muted3">yatırım</div></div>' +
        '</div>';
      }
      if (t.type === "penalty") {
        return '<div class="txRow">' +
          '<div class="txIcon" style="background:rgba(255,92,124,.14);color:#FF8FA6">!</div>' +
          '<div class="txMain"><div class="txTitle">Gecikme cezası</div>' +
          '<div class="txSub">Gün ' + t.day + ' · ' + Utils.escape(t.customer || "") + '</div></div>' +
          '<div class="txAmt"><div class="a num down">-' + Utils.money(t.total) + '</div>' +
          '<div class="b muted3">ceza</div></div>' +
        '</div>';
      }
      const p = GameState.product(t.product);
      const name = p ? p.name : t.product;
      if (t.type === "po") {
        return '<div class="txRow">' +
          '<div class="txIcon buy">⇥</div>' +
          '<div class="txMain"><div class="txTitle">Tedarik Siparişi · ' + Utils.escape(t.supplier || "") + '</div>' +
          '<div class="txSub num">Gün ' + t.day + ' · ' + Utils.qty(t.qty) + ' ton ' + name +
            ' @ ' + Utils.price(t.price) + ' · ' + t.leadTime + ' gün</div></div>' +
          '<div class="txAmt"><div class="a num">-' + Utils.money(t.total) + '</div>' +
          '<div class="b muted3">yolda</div></div>' +
        '</div>';
      }
      if (t.type === "contract") {
        return '<div class="txRow">' +
          '<div class="txIcon sell">✓</div>' +
          '<div class="txMain"><div class="txTitle">Sözleşme · ' + Utils.escape(t.customer || name) + '</div>' +
          '<div class="txSub num">Gün ' + t.day + ' · ' + Utils.qty(t.qty) + ' ton @ ' + Utils.price(t.price) + '</div></div>' +
          '<div class="txAmt"><div class="a num up">+' + Utils.money(t.total) + '</div>' +
          '<div class="b num ' + (t.profit >= 0 ? "up" : "down") + '">' + Utils.moneySigned(t.profit) + '</div></div>' +
        '</div>';
      }
      const isBuy = t.type === "buy";
      return '<div class="txRow">' +
        '<div class="txIcon ' + (isBuy ? "buy" : "sell") + '">' + (isBuy ? "↓" : "↑") + '</div>' +
        '<div class="txMain"><div class="txTitle">' + (isBuy ? "Alış" : "Satış") + ' · ' + Utils.escape(name) + '</div>' +
        '<div class="txSub num">Gün ' + t.day + ' · ' + Utils.qty(t.qty) + ' ton @ ' + Utils.price(t.price) + '</div></div>' +
        '<div class="txAmt"><div class="a num ' + (isBuy ? "" : "up") + '">' + (isBuy ? "-" : "+") + Utils.money(t.total) + '</div>' +
        (isBuy ? '<div class="b muted3">alış</div>'
               : '<div class="b num ' + (t.profit >= 0 ? "up" : "down") + '">' + Utils.moneySigned(t.profit) + '</div>') +
        '</div>' +
      '</div>';
    }).join("");
  },

  /* ---------------- screen: ŞİRKET ---------------- */
  renderCompany() {

    const invVal = GameState.inventoryValue();

    const next = CompanySystem.nextTier(value);

      '<div class="rowBetween">' +
        '<div><div class="muted3">ŞİRKET DEĞERİ</div>' +
        '<div style="font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--gold)" class="num">' + Utils.money(value) + '</div></div>' +
        '<div class="mktIcon" style="background:rgba(233,196,106,.12);color:#E9C46A;width:46px;height:46px;font-size:16px">' + CompanySystem.level(value) + '</div>' +
      '</div>' +
      '<div class="muted" style="margin-top:8px">Seviye ' + CompanySystem.level(value) + ' · ' + CompanySystem.title(value) + '</div>' +
      '<div class="progWrap"><div class="progFill" style="width:' + (prog * 100).toFixed(1) + '%"></div></div>' +
      '<div class="muted3" style="margin-top:7px">' +

      '</div>' +
    '</div>';

    html += '<div class="sectionTitle"><h2>İstatistikler</h2></div>';
    html += '<div class="statGrid">' +
      '<div class="statBox"><div class="k">Nakit</div><div class="v num">' + Utils.money(s.cash) + '</div></div>' +
      '<div class="statBox"><div class="k">Stok Değeri</div><div class="v num">' + Utils.money(invVal) + '</div></div>' +
      '<div class="statBox"><div class="k">Toplam Kâr</div><div class="v num ' +
        (s.stats.realizedProfit > 0 ? "up" : s.stats.realizedProfit < 0 ? "down" : "") + '">' +

      '<div class="statBox"><div class="k">Toplam İşlem</div><div class="v num">' + Utils.qty(s.stats.totalTrades) + '</div></div>' +
      '<div class="statBox"><div class="k">Gün</div><div class="v num">' + s.day + '</div></div>' +
      '<div class="statBox"><div class="k">Zirve Değer</div><div class="v num">' + Utils.money(s.stats.peakValue) + '</div></div>' +
    '</div>';

    html += '<div class="sectionTitle" style="margin-top:18px"><h2>İtibar</h2></div>';
    html += this.reputationCardHTML();

    html += '<div class="sectionTitle" style="margin-top:18px"><h2>Depo</h2></div>';
    html += this.upgradeCardHTML();

    html += '<div class="sectionTitle" style="margin-top:18px"><h2>Ünvanlar</h2></div>';
    html += '<div class="card"><div class="tierList">' +
      CONFIG.TITLES.map((t, i) => {
        const nextT = CONFIG.TITLES[i + 1];
        const req = nextT ? Utils.moneyShort(t.min) + " – " + Utils.moneyShort(nextT.min) : Utils.moneyShort(t.min) + "+";
        return '<div class="tierRow' + (i === tierIdx ? " on" : "") + '">' +
          '<div class="tierBadge">' + (i + 1) + '</div>' +
          '<div class="tierName">' + t.name + '</div>' +
          '<div class="tierReq num">' + req + '</div></div>';
      }).join("") + '</div></div>';

    $("#screenCompany").innerHTML = html;
  },

  /* ---------------- screen: PROFİL ---------------- */
  renderProfile() {
    const s = GameState.data;
    const value = GameState.companyValue();

    let html = '<div class="card">' +
      '<div class="rowBetween">' +

        '<div style="flex:1;margin-left:12px;min-width:0">' +
          '<div style="font-size:17px;font-weight:800">' + CompanySystem.title(value) + '</div>' +
          '<div class="muted3">Gün ' + s.day + ' · ' + Utils.money(value) + ' şirket değeri</div>' +

    html += '<div class="sectionTitle"><h2>Ayarlar</h2></div>';
    html += '<button class="setRow" data-action="sound">' +
      '<div class="t"><div class="a">Ses</div><div class="b">İşlem ve gün sesleri</div></div>' +
      '<div class="switch' + (s.settings.sound ? " on" : "") + '"></div>' +
    '</button>';

    html += '<div class="sectionTitle" style="margin-top:16px"><h2>Oyun</h2></div>';
    html += '<button class="setRow" data-action="newgame">' +
      '<div class="t"><div class="a">Yeni Oyun</div><div class="b">Baştan başla, ayarlar korunur</div></div>' +
      '<span class="muted3">›</span>' +
    '</button>';
    html += '<button class="setRow" data-action="reset">' +
      '<div class="t"><div class="a" style="color:var(--down)">Oyunu Sıfırla</div>' +

    html += '<div class="card" style="margin-top:16px">' +

  }
};

/* ---------------------------------------------------------------------------
 * UI — bottom sheet (al/sat), onay diyalogları, efektler
 * -------------------------------------------------------------------------*/
Object.assign(UI, {

  openSheet(mode, productId) {
    const max = mode === "buy" ? TradingSystem.maxBuy(productId) : TradingSystem.maxSell(productId);
    this.sheet = { open: true, mode: mode, productId: productId, qty: Math.min(1, max), confirm: null };
    this.renderSheet();
    this.showSheet();
  },

  /** Tedarikçi sipariş ekranı. Başlangıç miktarı minimum siparişe eşitlenir. */
  openPoSheet(supplierId, productId) {
    const sup = ProcurementSystem.supplier(supplierId);
    if (!sup) return;
    const max = ProcurementSystem.maxOrder(supplierId, productId);
    this.sheet = {
      open: true, mode: "po", productId: productId, supplierId: supplierId,
      qty: Math.min(sup.minQty, max), confirm: null
    };
    this.renderSheet();
    this.showSheet();
  },

  openConfirm(cfg) {
    this.sheet = { open: true, mode: "confirm", productId: null, qty: 0, confirm: cfg };
    this.renderSheet();
    this.showSheet();
  },

  showSheet() {
    this.el.backdrop.classList.add("show");
    requestAnimationFrame(() => this.el.sheet.classList.add("show"));
  },

  closeSheet() {
    this.sheet.open = false;
    this.el.sheet.classList.remove("show");
    this.el.backdrop.classList.remove("show");
  },

  setQty(q) {
    const max = this.sheetMax();
    this.sheet.qty = Utils.clamp(Math.floor(q), 0, max);
    this.renderSheet();
  },

  sheetMax() {
    const st = this.sheet;
    if (!st.productId) return 0;
    if (st.mode === "po") return ProcurementSystem.maxOrder(st.supplierId, st.productId);
    return st.mode === "buy" ? TradingSystem.maxBuy(st.productId) : TradingSystem.maxSell(st.productId);
  },

  handleSheetAction(action, ds) {
    switch (action) {
      case "close":
        Audio_.tap();
        var back = this.sheet.mode === "confirm" && this.sheet.confirm && this.sheet.confirm.onCancel;
        if (back) back(); else this.closeSheet();
        break;
      case "qty":   Audio_.tap(); Audio_.haptic(6); this.setQty(ds.q === "max" ? this.sheetMax() : parseInt(ds.q, 10)); break;
      case "inc":   Audio_.haptic(5); this.setQty(this.sheet.qty + 1); break;
      case "dec":   Audio_.haptic(5); this.setQty(this.sheet.qty - 1); break;
      case "confirm": this.confirmTrade(); break;
      case "poConfirm": this.confirmPurchaseOrder(); break;
      case "confirmYes":
        var cb = this.sheet.confirm && this.sheet.confirm.onConfirm;
        this.closeSheet();
        if (cb) cb();
        break;
    }
  },

  renderSheet() {
    const st = this.sheet;
    if (st.mode === "confirm") { this.renderConfirmSheet(); return; }
    if (st.mode === "po") { this.renderPoSheet(); return; }

    const p = GameState.product(st.productId);
    if (!p) return;
    const isBuy = st.mode === "buy";
    const price = GameState.price(p.id);
    const h = GameState.holding(p.id);
    const max = this.sheetMax();
    const qty = Utils.clamp(st.qty, 0, max);
    const total = Utils.round2(price * qty);

    const presets = [1, 5, 10, 25];
    const chips = presets.map((n) =>
      '<button class="chip' + (qty === n ? " active" : "") + '"' + (n > max ? " disabled" : "") +
      ' data-sheet="qty" data-q="' + n + '">' + n + '</button>').join("") +
      '<button class="chip' + (qty === max && max > 0 ? " active" : "") + '"' + (max <= 0 ? " disabled" : "") +
      ' data-sheet="qty" data-q="max">MAX</button>';

    let rows = "";
    if (isBuy) {
      const after = Utils.round2(GameState.data.cash - total);
      const spaceAfter = GameState.freeCapacity() - qty;
      rows =
        '<div class="pRow"><span class="k">Birim fiyat</span><span class="v num">' + Utils.price(price) + '</span></div>' +
        '<div class="pRow total"><span class="k">Toplam maliyet</span><span class="v num">' + Utils.money(total) + '</span></div>' +
        '<div class="pRow"><span class="k">İşlem sonrası nakit</span><span class="v num ' + (after < 0 ? "down" : "") + '">' + Utils.money(after) + '</span></div>' +
        '<div class="pRow"><span class="k">Kullanılacak depo alanı</span><span class="v num">' + Utils.qty(qty) + ' / ' + Utils.qty(GameState.freeCapacity()) + ' ton</span></div>' +
        '<div class="pRow"><span class="k">Kalan depo alanı</span><span class="v num">' + Utils.qty(Math.max(0, spaceAfter)) + ' ton</span></div>';
    } else {
      const profit = Utils.round2((price - h.avgCost) * qty);
      const after = Utils.round2(GameState.data.cash + total);
      rows =
        '<div class="pRow"><span class="k">Birim fiyat</span><span class="v num">' + Utils.price(price) + '</span></div>' +
        '<div class="pRow"><span class="k">Ortalama maliyet</span><span class="v num">' + Utils.price(h.avgCost) + '</span></div>' +
        '<div class="pRow total"><span class="k">Toplam gelir</span><span class="v num">' + Utils.money(total) + '</span></div>' +
        '<div class="pRow"><span class="k">Kâr / Zarar</span><span class="v num ' + (profit > 0 ? "up" : profit < 0 ? "down" : "") + '">' + Utils.moneySigned(profit) + '</span></div>' +
        '<div class="pRow"><span class="k">İşlem sonrası nakit</span><span class="v num">' + Utils.money(after) + '</span></div>' +
        '<div class="pRow"><span class="k">Kalan stok</span><span class="v num">' + Utils.qty(h.qty - qty) + ' ' + p.unit + '</span></div>';
    }

    // Sözleşme taahhüdünü bozacak satış uyarısı
    let commitWarn = "";
    if (!isBuy) {
      const free = GameState.freeStock(p.id);
      if (qty > free) {
        commitWarn = '<div class="warnLine">Bu satış sözleşme taahhüdünü bozar · ' +
          Utils.qty(qty - free) + ' ton taahhüt altında</div>';
      }
    }

    let err = "";
    if (max <= 0) {
      err = isBuy
        ? (GameState.freeCapacity() <= 0 ? "Depo dolu — önce satış yap veya depoyu geliştir" : "Bu ürünü alacak nakit yok")
        : "Bu üründen stokta yok";
    }

    this.el.sheet.innerHTML =
      '<div class="grabber"></div>' +
      '<div class="shHead">' +
        this.productIcon(p) +
        '<div><div class="shName">' + p.name + '</div>' +
        '<div class="shSub num">' + Utils.price(price) + ' / ' + p.unit +
          (h.qty > 0 ? ' · Stok ' + Utils.qty(h.qty) : "") + '</div></div>' +
        '<span class="shTag ' + (isBuy ? "buy" : "sell") + '">' + (isBuy ? "SATIN AL" : "SAT") + '</span>' +
      '</div>' +
      '<div class="qtyChips">' + chips + '</div>' +
      '<div class="stepper">' +
        '<button class="stepBtn" data-sheet="dec"' + (qty <= 0 ? " disabled" : "") + '>−</button>' +
        '<div class="stepVal"><div class="n num">' + Utils.qty(qty) + '</div><div class="u">' + p.unit + ' · max ' + Utils.qty(max) + '</div></div>' +
        '<button class="stepBtn" data-sheet="inc"' + (qty >= max ? " disabled" : "") + '>+</button>' +
      '</div>' +
      '<div class="previewBox">' + rows + '</div>' +
      commitWarn +
      '<div class="shErr">' + err + '</div>' +
      '<div class="mktBtns" style="margin-top:0">' +
        '<button class="btn ghost" data-sheet="close">VAZGEÇ</button>' +
        '<button class="btn ' + (isBuy ? "primary" : "sell") + '" data-sheet="confirm"' + (qty <= 0 ? " disabled" : "") + '>' +
          (isBuy ? "SATIN AL" : "SAT") + '</button>' +
      '</div>';
  },

  renderPoSheet() {
    const st = this.sheet;
    const sup = ProcurementSystem.supplier(st.supplierId);
    const p = GameState.product(st.productId);
    if (!sup || !p) return;

    const price = ProcurementSystem.quote(sup.id, p.id);
    const market = GameState.price(p.id);
    const delta = ProcurementSystem.delta(sup.id, p.id);
    const max = this.sheetMax();
    const qty = Utils.clamp(st.qty, 0, max);
    const total = Utils.round2((price || 0) * qty);
    const fit = ProcurementSystem.contractFit(p.id, sup.leadTime);
    const avail = GameState.availableCapacity();

    const presets = [1, 5, 10, 25];
    const chips = presets.map((n) =>
      '<button class="chip' + (qty === n ? " active" : "") + '"' + (n > max || n < sup.minQty ? " disabled" : "") +
      ' data-sheet="qty" data-q="' + n + '">' + n + '</button>').join("") +
      '<button class="chip' + (qty === max && max >= sup.minQty ? " active" : "") + '"' +
      (max < sup.minQty ? " disabled" : "") + ' data-sheet="qty" data-q="max">MAX</button>';

    const belowMin = qty < sup.minQty;
    const err = max < sup.minQty
      ? "Minimum " + Utils.qty(sup.minQty) + " ton için nakit veya depo alanı yetmiyor"
      : (belowMin ? "Minimum sipariş " + Utils.qty(sup.minQty) + " ton" : "");

    this.el.sheet.innerHTML =
      '<div class="grabber"></div>' +
      '<div class="shHead">' +
        this.productIcon(p) +
        '<div><div class="shName">' + Utils.escape(sup.name) + '</div>' +
        '<div class="shSub num">' + p.name + ' · ' + Utils.price(price || 0) + '/ton · ' + sup.leadTime + ' gün</div></div>' +
        '<span class="shTag buy">SİPARİŞ</span>' +
      '</div>' +
      '<div class="qtyChips">' + chips + '</div>' +
      '<div class="stepper">' +
        '<button class="stepBtn" data-sheet="dec"' + (qty <= 0 ? " disabled" : "") + '>−</button>' +
        '<div class="stepVal"><div class="n num">' + Utils.qty(qty) + '</div>' +
        '<div class="u">' + p.unit + ' · min ' + Utils.qty(sup.minQty) + ' · max ' + Utils.qty(max) + '</div></div>' +
        '<button class="stepBtn" data-sheet="inc"' + (qty >= max ? " disabled" : "") + '>+</button>' +
      '</div>' +
      '<div class="previewBox">' +
        '<div class="pRow"><span class="k">Tedarikçi birim fiyatı</span><span class="v num">' + Utils.price(price || 0) + '</span></div>' +
        '<div class="pRow"><span class="k">Spot piyasa fiyatı</span><span class="v num">' + Utils.price(market) + '</span></div>' +
        '<div class="pRow"><span class="k">Spota göre fark</span><span class="v num ' +
          (delta < 0 ? "up" : delta > 0 ? "down" : "") + '">' + Utils.pct(delta) + '</span></div>' +
        '<div class="pRow"><span class="k">Teslim süresi</span><span class="v">' + sup.leadTime + ' gün</span></div>' +
        '<div class="pRow total"><span class="k">Toplam maliyet</span><span class="v num">' + Utils.money(total) + '</span></div>' +
        '<div class="pRow"><span class="k">Sipariş sonrası nakit</span><span class="v num ' +
          (GameState.data.cash - total < 0 ? "down" : "") + '">' + Utils.money(GameState.data.cash - total) + '</span></div>' +
        '<div class="pRow"><span class="k">Rezerve edilecek alan</span><span class="v num">' + Utils.qty(qty) + ' ton</span></div>' +
        '<div class="pRow"><span class="k">Kalan kullanılabilir kapasite</span><span class="v num">' +
          Utils.qty(Math.max(0, avail - qty)) + ' ton</span></div>' +
      '</div>' +
      this.fitLineHTML(fit, sup.leadTime) +
      '<div class="shErr">' + err + '</div>' +
      '<div class="mktBtns" style="margin-top:10px">' +
        '<button class="btn ghost" data-sheet="close">VAZGEÇ</button>' +
        '<button class="btn primary" data-sheet="poConfirm"' + (belowMin || qty <= 0 ? " disabled" : "") + '>' +
          'SİPARİŞ VER</button>' +
      '</div>';
  },

  confirmPurchaseOrder() {
    const st = this.sheet;
    const sup = ProcurementSystem.supplier(st.supplierId);
    const p = GameState.product(st.productId);
    if (!sup || !p) return;

    const res = ProcurementSystem.order(sup.id, p.id, st.qty);
    if (!res.ok) {
      Audio_.error(); Audio_.haptic(30);
      this.toast(res.reason, "err");
      this.renderSheet();
      return;
    }
    this.closeSheet();
    Audio_.buy(); Audio_.haptic(14);
    this.fx("neutral", "-" + Utils.money(res.order.totalCost),
      Utils.qty(res.order.qty) + " TON · " + res.order.leadTime + " GÜN");
    this.toast(Utils.qty(res.order.qty) + " ton " + p.name + " sipariş edildi · " +
      sup.name + " · " + res.order.leadTime + " gün", "ok");
    this.render();
  },

  renderConfirmSheet() {
    const c = this.sheet.confirm || {};
    this.el.sheet.innerHTML =
      '<div class="grabber"></div>' +
      '<div style="text-align:center;padding:4px 4px ' + (c.rows ? "12px" : "16px") + '">' +
        (c.tag ? '<div class="shTag sell" style="display:inline-block;margin-bottom:9px">' +
          Utils.escape(c.tag) + '</div>' : "") +
        '<div style="font-size:19px;font-weight:800;letter-spacing:-.2px">' + Utils.escape(c.title || "") + '</div>' +
        '<div class="muted" style="margin-top:8px;line-height:1.5">' + Utils.escape(c.body || "") + '</div>' +
      '</div>' +
      (c.rows ? '<div class="previewBox">' + c.rows + '</div>' : "") +
      '<div class="mktBtns" style="margin-top:0">' +
        '<button class="btn ghost" data-sheet="close">VAZGEÇ</button>' +
        '<button class="btn ' + (c.danger ? "danger" : "primary") + '" data-sheet="confirmYes">' +
          Utils.escape(c.confirmLabel || "ONAYLA") + '</button>' +
      '</div>';
  },

  confirmTrade() {
    const st = this.sheet;
    const p = GameState.product(st.productId);
    const qty = st.qty;
    if (!p || qty <= 0) return;

    // Taahhütlü stok satışı engellenmez, ancak bilinçli bir karar olmalıdır:
    // sözleşme açığı doğuracak satış ikinci bir risk onayı ister.
    if (st.mode === "sell" && qty > GameState.freeStock(p.id)) {
      this.confirmRiskySell(p.id, qty);
      return;
    }
    this.executeTrade(st.mode, p.id, qty);
  },

  /** Sözleşme açığı doğuracak satış için risk onayı. */
  confirmRiskySell(productId, qty) {
    const p = GameState.product(productId);
    const h = GameState.holding(productId);
    const committed = GameState.committed(productId);
    const gap = Math.max(0, committed - (h.qty - qty));
    const related = GameState.data.contracts.filter((c) => c.product === productId);

    // En yakın teslim: önce gecikmişler, sonra en az günü kalan
    const rank = (c) => (c.status === "overdue" ? -1 : c.daysLeft);
    let soonest = null;
    related.forEach((c) => { if (!soonest || rank(c) < rank(soonest)) soonest = c; });

    // Nakit olarak risk altındaki tutar: henüz kesilmemiş cezalar
    const unpaid = related.filter((c) => !c.penaltyPaid);
    const penalty = Utils.round2(unpaid.reduce((sum, c) => sum + c.penalty, 0));

    const rows =
      '<div class="pRow"><span class="k">Oluşacak ürün açığı</span>' +
        '<span class="v num down">' + Utils.qty(gap) + ' ton</span></div>' +
      '<div class="pRow"><span class="k">En yakın teslim süresi</span>' +
        '<span class="v">' + (soonest ? this.deadlineText(soonest) : "—") + '</span></div>' +
      '<div class="pRow"><span class="k">Taahhüt altında kalacak miktar</span>' +
        '<span class="v num">' + Utils.qty(committed) + ' ton</span></div>' +
      '<div class="pRow"><span class="k">İlgili sözleşmeler</span>' +
        '<span class="v num">' + related.length + ' adet</span></div>' +
      '<div class="pRow"><span class="k">Toplam potansiyel ceza</span>' +
        '<span class="v num ' + (penalty > 0 ? "down" : "") + '">' +
        (penalty > 0 ? "-" + Utils.money(penalty) : "ceza zaten kesildi") + '</span></div>';

    Audio_.error();
    this.openConfirm({
      tag: "SÖZLEŞME RİSKİ",
      title: "Taahhütlü stoğu satıyorsun",
      body: "Bu satıştan sonra aktif sözleşmelerin için " + Utils.qty(gap) + " ton " +
        p.name.toLowerCase() + " açığı oluşacak. Teslime kadar malı yeniden bulman gerekir.",
      rows: rows,
      confirmLabel: "RİSKİ AL VE SAT",
      danger: true,
      onConfirm: () => this.executeTrade("sell", productId, qty),
      // VAZGEÇ satışı yapmaz, satış ekranına geri döner
      onCancel: () => { this.openSheet("sell", productId); this.setQty(qty); }
    });
  },

  executeTrade(mode, productId, qty) {
    const p = GameState.product(productId);
    const res = mode === "buy" ? TradingSystem.buy(productId, qty) : TradingSystem.sell(productId, qty);
    if (!res.ok) {
      Audio_.error(); Audio_.haptic(30);
      this.toast(res.reason, "err");
      if (this.sheet.mode === "confirm") this.closeSheet(); else this.renderSheet();
      this.render();
      return;
    }

    this.closeSheet();

    if (mode === "buy") {
      Audio_.buy(); Audio_.haptic(14);
      this.fx("neutral", "-" + Utils.money(res.total), Utils.qty(res.qty) + " " + p.unit.toUpperCase() + " ALINDI");
      this.toast(Utils.qty(res.qty) + " " + p.unit + " " + p.name + " alındı", "ok");
    } else {
      const win = res.profit >= 0;
      if (win) { Audio_.profit(); Audio_.haptic([12, 40, 18]); }
      else { Audio_.loss(); Audio_.haptic(28); }
      this.fx(win ? "up" : "down", Utils.moneySigned(res.profit), win ? "KÂR" : "ZARAR");
      this.toast(Utils.qty(res.qty) + " " + p.unit + " " + p.name + " satıldı · " + Utils.money(res.total), win ? "ok" : "err");
    }
    this.render();
  },


  /* ---------------- sözleşme aksiyonları ---------------- */
  acceptOffer(id) {
    const offer = GameState.data.offers.find((o) => o.id === id);
    const res = ContractSystem.accept(id);
    if (!res.ok) {
      Audio_.error(); Audio_.haptic(30);
      this.toast(res.reason, "err");
      this.render();
      return;
    }
    const p = GameState.product(res.contract.product);
    Audio_.contract(); Audio_.haptic([12, 40, 18]);
    this.fx("neutral", Utils.qty(res.contract.qty) + " TON", res.contract.totalDays + " GÜNDE TESLİM");
    this.toast("Sözleşme kabul edildi · " + (offer ? offer.customer : "") + " · Aktif sekmesinde", "ok");
    this.render();
  },

  rejectOffer(id) {
    const res = ContractSystem.reject(id);
    if (!res.ok) { this.toast(res.reason, "err"); this.render(); return; }
    Audio_.tap(); Audio_.haptic(8);
    this.toast("Teklif reddedildi", "ok");
    this.render();
  },

  deliverContract(id) {
    const c = ContractSystem.contract(id);
    if (!c) { this.toast("Sözleşme bulunamadı", "err"); this.render(); return; }
    const res = ContractSystem.deliver(id);
    if (!res.ok) {
      Audio_.error(); Audio_.haptic(30);
      this.toast(res.reason, "err");
      this.render();
      return;
    }
    const win = res.profit >= 0;
    if (win) { Audio_.contract(); Audio_.haptic([14, 45, 20]); }
    else { Audio_.loss(); Audio_.haptic(28); }
    this.fx(win ? "up" : "down", Utils.moneySigned(res.profit),
      res.late ? "GEÇ TESLİM" : "SÖZLEŞME TAMAM");
    this.toast(res.contract.customer + " · " + Utils.money(res.value) + " tahsil edildi · " +
      (res.rep >= 0 ? "+" : "") + res.rep + " itibar", res.late ? "err" : "ok");
    this.render();
  },

  confirmCancelContract(id) {
    const c = ContractSystem.contract(id);
    if (!c) return;
    Audio_.tap();
    const cost = c.penaltyPaid ? "Ceza zaten kesildi." : "Ceza olarak " + Utils.money(c.penalty) + " ödeyeceksin.";
    this.openConfirm({
      title: "Sözleşme iptal edilsin mi?",
      body: c.customer + " · " + Utils.qty(c.qty) + " ton. " + cost +
        " İtibarın " + CONFIG.CONTRACTS.REP.CANCEL + " puan düşecek.",
      confirmLabel: "İPTAL ET",
      danger: true,
      onConfirm: () => {
        const res = ContractSystem.cancel(id);
        if (!res.ok) { this.toast(res.reason, "err"); this.render(); return; }
        Audio_.loss(); Audio_.haptic(35);
        if (res.penalty > 0) this.fx("down", "-" + Utils.money(res.penalty), "CEZA");
        this.toast("Sözleşme iptal edildi · " + res.rep + " itibar", "err");
        this.render();
      }
    });
  },

  doUpgrade() {
    const res = CompanySystem.upgradeWarehouse();
    if (!res.ok) {
      Audio_.error(); Audio_.haptic(30);
      this.toast(res.reason, "err");
      return;
    }
    Audio_.upgrade(); Audio_.haptic([14, 50, 20]);
    this.fx("neutral", Utils.qty(res.capacity) + " TON", "DEPO SEVİYE " + res.level);
    this.toast("Depo seviye " + res.level + " · " + Utils.qty(res.capacity) + " ton", "ok");
    this.render();
  },

  toggleSound() {
    const s = GameState.data;
    s.settings.sound = !s.settings.sound;
    SaveSystem.save();
    if (s.settings.sound) Audio_.tap();
    Audio_.haptic(10);
    this.render();
    this.toast(s.settings.sound ? "Ses açık" : "Ses kapalı", "ok");
  },

  confirmNewGame() {
    Audio_.tap();
    this.openConfirm({
      title: "Yeni oyun başlat?",
      body: "Mevcut ilerlemen silinecek ve 10.000 $ sermaye ile 1. günden başlayacaksın.",
      confirmLabel: "YENİ OYUN",
      danger: false,
      onConfirm: () => Game.newGame(true)
    });
  },

  confirmReset() {
    Audio_.tap();
    this.openConfirm({
      title: "Oyunu sıfırla?",
      body: "Kayıtlı tüm veriler (ilerleme, istatistikler ve ayarlar) kalıcı olarak silinecek.",
      confirmLabel: "SIFIRLA",
      danger: true,
      onConfirm: () => Game.newGame(false)
    });
  },

  /* ---------------- efektler ---------------- */
  fx(kind, amount, label) {
    const d = document.createElement("div");
    d.className = "fxPop " + kind;
    d.innerHTML = '<div class="a num">' + Utils.escape(amount) + '</div><div class="b">' + Utils.escape(label) + '</div>';
    this.el.fx.appendChild(d);
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 1600);
  },

  toast(msg, kind) {
    const d = document.createElement("div");
    d.className = "toast " + (kind || "");
    d.textContent = msg;
    this.el.toast.appendChild(d);
    setTimeout(() => {
      d.classList.add("out");
      setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 300);
    }, 1900);
  },

  dayFlash(day) {
    const el = this.el.dayFlash;
    el.querySelector(".t").textContent = "GÜN " + day;
    el.classList.remove("go");
    void el.offsetWidth;
    el.classList.add("go");
  }
});

/* ===========================================================================
 * Game — akış kontrolü
 * =========================================================================*/
const Game = {
  busy: false,

  init() {
    const loaded = SaveSystem.load();
    GameState.data = loaded || GameState.createNew();
    if (!loaded) {
      // Yeni oyun 1. günde boş bir Fırsatlar ekranıyla başlamasın
      ContractSystem.rollOffers();
      if (!GameState.data.offers.length) {
        const o = ContractSystem.makeOffer();
        if (o) GameState.data.offers.push(o);
      }
    }
    // Tedarikçi teklifleri: aynı güne ait kayıt varsa korunur, yoksa üretilir.
    if (ProcurementSystem.ensureQuotes() || !loaded) SaveSystem.saveNow();
    UI.init();
    UI.switchTab("market");
  },

  newGame(keepSettings) {
    const settings = keepSettings
      ? { sound: GameState.data.settings.sound }
      : { sound: true };
    SaveSystem.clear();
    GameState.data = GameState.createNew(settings);
    const o = ContractSystem.makeOffer();
    if (o) GameState.data.offers.push(o);
    ProcurementSystem.ensureQuotes();
    UI.tradeSegment = "offers";
    SaveSystem.saveNow();
    UI.switchTab("market");
    UI.toast(keepSettings ? "Yeni oyun başladı" : "Oyun sıfırlandı", "ok");
    Audio_.day();
  },

  nextDay() {
    if (this.busy) return;
    this.busy = true;
    const btn = $("#nextDayBtn");
    btn.classList.add("busy");

    const s = GameState.data;
    s.day += 1;

    // 1) Haber çıkabilir (aynı gün fiyatı etkiler)
    const news = EventSystem.roll();
    // 2) Fiyatlar güncellenir
    MarketSystem.advanceDay();
    // 3) Aktif olayların süresi azalır
    EventSystem.tick();
    // 4) Yoldaki tedarik siparişleri ilerler; o gün ulaşanlar depoya girer.
    //    Sözleşme süresi işlemeden ÖNCE gelmeli ki son gün ulaşan mal
    //    sözleşmeyi zamanında kapatabilsin.
    const arrivals = ProcurementSystem.tickDay();
    // 5) Sözleşme süreleri işler (son gün geçerse ceza, telafi dolarsa iflas)
    const contractEvents = ContractSystem.tickDay();
    // 6) Yeni teklifler gelir, eskiler düşer
    const offerRoll = ContractSystem.rollOffers();
    // 7) Güncellenmiş piyasa fiyatlarından yeni tedarikçi teklifleri üretilir
    ProcurementSystem.ensureQuotes();

    const value = GameState.companyValue();
    if (value > s.stats.peakValue) s.stats.peakValue = Utils.round2(value);

    SaveSystem.save();

    Audio_.day(); Audio_.haptic(12);
    UI.dayFlash(s.day);
    UI.flashPrices = true;
    UI.render();

    // Bildirimler: önce depoya ulaşan mal, sonra kötü haber, sonra fırsat
    arrivals.forEach((o, i) => {
      const p = GameState.product(o.product);
      setTimeout(() => {
        Audio_.arrival();
        UI.toast(Utils.qty(o.qty) + " ton " + (p ? p.name : "") + " depoya ulaştı · " + o.supplierName, "ok");
      }, 150 + i * 450);
    });
    const notifyBase = arrivals.length ? 150 + arrivals.length * 450 : 250;

    contractEvents.forEach((ev, i) => {
      setTimeout(() => {
        if (ev.type === "overdue") {
          Audio_.error();
          UI.toast(ev.contract.customer + " · teslim gecikti, " + Utils.money(ev.penalty) + " ceza", "err");
        } else {
          UI.toast(ev.contract.customer + " · sözleşme iptal edildi, itibar düştü", "err");
        }
      }, notifyBase + i * 500);
    });

    if (news && UI.currentTab !== "market") {
      UI.toast("Yeni piyasa haberi: " + news.title, "ok");
    }
    if (offerRoll.created) {
      const o = offerRoll.created;
      const p = GameState.product(o.product);
      setTimeout(() => {
        Audio_.offer();
        UI.toast("Yeni talep: " + o.customer + " · " + Utils.qty(o.qty) + " ton " + (p ? p.name : ""), "ok");
      }, notifyBase + contractEvents.length * 500);
    }

    setTimeout(() => { this.busy = false; btn.classList.remove("busy"); }, 320);
  }
};

/* ===========================================================================
 * Boot
 * =========================================================================*/
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => Game.init());
} else {
  Game.init();
}

/* Test/otomasyon kancası (konsoldan erişim için) */
window.TradeEmpire = {
  CONFIG: CONFIG, GameState: GameState, MarketSystem: MarketSystem,
  InventorySystem: InventorySystem, TradingSystem: TradingSystem,
  EventSystem: EventSystem, CompanySystem: CompanySystem,
  ReputationSystem: ReputationSystem, ContractSystem: ContractSystem,
  ProcurementSystem: ProcurementSystem,
  SaveSystem: SaveSystem, UI: UI, Game: Game
};
</script>
