<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Demir Cephe: 1936-1945 dönemini konu alan, dünya haritalı mobil büyük strateji oyunu.">
<title>Demir Cephe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <canvas id="map" aria-label="Dünya haritası"></canvas>

  <header id="hud" hidden>
    <div class="hud-row">
      <button id="hud-country" class="hud-country" data-act="panel" data-p="pol"></button>
      <div class="hud-date">
        <span id="hud-date"></span>
        <span id="hud-tension" class="hud-tension" title="Dünya gerginliği"></span>
      </div>
      <div class="speed" role="group" aria-label="Oyun hızı">
        <button id="btn-pause" class="sp-pause" data-act="pause" aria-label="Duraklat / devam"></button>
        <button data-act="speed" data-v="1">1</button>
        <button data-act="speed" data-v="2">2</button>
        <button data-act="speed" data-v="3">3</button>
        <button data-act="speed" data-v="4">4</button>
        <button data-act="speed" data-v="5">5</button>
      </div>
    </div>
    <div class="hud-res" id="hud-res"></div>
    <div class="hud-alerts" id="hud-alerts" hidden></div>
  </header>

  <div id="toasts" aria-live="polite"></div>

  <div id="map-tools" hidden>
    <button data-act="mapmode" id="btn-mapmode" aria-label="Harita modu"></button>
    <button data-act="boxsel" id="btn-box" aria-label="Alan seçimi"></button>
    <button data-act="home" aria-label="Başkente git"></button>
    <button data-act="panel" data-p="menu" id="btn-menu" aria-label="Menü"></button>
  </div>

  <section id="card" class="card" hidden></section>
  <section id="selbar" class="selbar" hidden></section>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet-head">
      <button class="sheet-back" id="sheet-back" data-act="back" hidden aria-label="Geri">‹</button>
      <h2 id="sheet-title"></h2>
      <button class="sheet-close" data-act="close" aria-label="Kapat">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <nav id="nav" hidden>
    <button data-act="panel" data-p="pol"><i class="ic ic-pol"></i><span>Siyaset</span></button>
    <button data-act="panel" data-p="res"><i class="ic ic-res"></i><span>Bilim</span></button>
    <button data-act="panel" data-p="prod"><i class="ic ic-prod"></i><span>Üretim</span></button>
    <button data-act="panel" data-p="con"><i class="ic ic-con"></i><span>İnşaat</span></button>
    <button data-act="panel" data-p="trade"><i class="ic ic-trade"></i><span>Ticaret</span></button>
    <button data-act="panel" data-p="army"><i class="ic ic-army"></i><span>Ordu</span></button>
    <button data-act="panel" data-p="navy"><i class="ic ic-navy"></i><span>Donanma</span></button>
    <button data-act="panel" data-p="dip"><i class="ic ic-dip"></i><span>Diplomasi</span></button>
    <button data-act="panel" data-p="air"><i class="ic ic-air"></i><span>Hava</span></button>
  </nav>

  <div id="modal" class="modal" hidden></div>

  <section id="start" class="start">
    <div class="start-inner">
      <div class="start-brand">
        <p class="eyebrow">1 Ocak 1936 — Büyük Strateji</p>
        <h1>Demir<br>Cephe</h1>
        <p class="lede">Bir ulus seç. Sanayini kur, ordunu eğit, ittifakları yönet ve dünyanın kaderini belirle.</p>
      </div>
      <div id="start-body"></div>
    </div>
  </section>
</div>
<!--/APP-->
<script src="js/data/map.js"></script>
<script src="js/data/countries.js"></script>
<script src="js/data/content.js"></script>
<script src="js/data/leaders.js"></script>
<script src="js/data/focus.js"></script>
<script src="js/data/focus_ext.js"></script>
<script src="js/game/core.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/sim.js"></script>
<script src="js/game/diplomacy.js"></script>
<script src="js/game/ai.js"></script>
<script src="js/game/army.js"></script>
<script src="js/game/politics.js"></script>
<script src="js/game/trade.js"></script>
<script src="js/game/navy.js"></script>
<script src="js/game/logistics.js"></script>
<script src="js/game/airwar.js"></script>
<script src="js/game/events.js"></script>
<script src="js/ui/flags.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
