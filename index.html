/* ===========================================================================
 * Utils
 * =========================================================================*/
const Utils = {
  $: (sel, root) => (root || document).querySelector(sel),
  $$: (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel)),

  clamp: (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v),
  round2: (v) => Math.round(v * 100) / 100,
  lerp: (a, b, t) => a + (b - a) * (t < 0 ? 0 : t > 1 ? 1 : t),

  /** Para: $12,340 (tam dolar) */
  money(v) {
    const neg = v < 0;
    const n = Math.round(Math.abs(v));
    return (neg ? "-$" : "$") + n.toLocaleString("en-US");
  },
  /** Kısa para (üst kartlar): $1.24M */
  moneyShort(v) {
    const neg = v < 0, a = Math.abs(v);
    if (a >= 1e9) return (neg ? "-$" : "$") + (a / 1e9).toFixed(2) + "B";
    if (a >= 1e6) return (neg ? "-$" : "$") + (a / 1e6).toFixed(2) + "M";
    return Utils.money(v);
  },
  /** İşaretli para: +$430 / -$120 */
  moneySigned(v) {
    const s = v > 0 ? "+" : v < 0 ? "-" : "";
    return s + "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
  },
  /** Birim fiyat: $2,450 · $304 · $251.40 (kuruş sadece gerektiğinde) */
  price(v) {
    if (Math.abs(v) >= 1000) return "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
    const frac = Math.abs(v - Math.round(v)) > 0.004;
    return "$" + v.toLocaleString("en-US", { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 });
  },
  pct(v, digits) {
    const d = (digits === undefined) ? 1 : digits;
    const t = (v * 100).toFixed(d);
    return (parseFloat(t) > 0 ? "+" : "") + t + "%";
  },
  qty: (v) => v.toLocaleString("en-US"),

  escape(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
};
const $ = Utils.$, $$ = Utils.$$;

/* ===========================================================================
 * GameState — tek doğruluk kaynağı
 * =========================================================================*/
const GameState = {
  data: null,

  /** Sıfırdan yeni oyun state'i üretir. */
  createNew(keepSettings) {
    const market = {};
    CONFIG.PRODUCTS.forEach((p) => {
      market[p.id] = { price: p.base, prev: p.base, change: 0, momentum: 0, history: [p.base] };
    });
    const inventory = {};
    CONFIG.PRODUCTS.forEach((p) => { inventory[p.id] = { qty: 0, avgCost: 0 }; });

    return {
      version: CONFIG.VERSION,
      seed: (Math.random() * 4294967295) >>> 0,
      day: 1,
      cash: CONFIG.START_CASH,
      warehouseLevel: 1,
      market: market,
      inventory: inventory,
      activeEvents: [],
      news: [],
      transactions: [],

      /* V2 · Sözleşmeler */
      reputation: CONFIG.CONTRACTS.REP.START,
      contractSeq: 1,
      offers: [],           // bekleyen teklifler (Fırsatlar)
      contracts: [],        // kabul edilmiş aktif sözleşmeler
      contractLog: [],      // tamamlanan / başarısız sözleşme geçmişi

      /* V2 Part 2 · Tedarik */
      purchaseSeq: 1,
      supplierQuotes: null, // { day, prices: { supplierId: { productId: fiyat } } }
      purchaseOrders: [],   // yoldaki satın alma siparişleri
      purchaseHistory: [],  // teslim alınmış siparişler

      stats: {
        realizedProfit: 0,
        totalTrades: 0,
        totalBought: 0,
        totalSold: 0,
        peakValue: CONFIG.START_CASH,
        contractsDone: 0,
        contractsLate: 0,
        contractsFailed: 0,
        contractRevenue: 0,
        penaltiesPaid: 0,
        poCount: 0,          // verilen tedarikçi siparişi
        poTons: 0,           // tedarikçiden alınan toplam ton
        poSpent: 0           // tedarikçiye harcanan toplam tutar
      },
      settings: keepSettings || { sound: true }
    };
  },

  /* ---- türetilmiş değerler ---- */
  product(id) { return CONFIG.PRODUCTS.find((p) => p.id === id); },
  price(id) { return this.data.market[id].price; },
  holding(id) { return this.data.inventory[id]; },

  capacity() { return CONFIG.WAREHOUSE[this.data.warehouseLevel - 1].capacity; },
  /** Depoda fiilen duran mal. */
  usedCapacity() {
    return CONFIG.PRODUCTS.reduce((s, p) => s + this.data.inventory[p.id].qty, 0);
  },
  /** Yoldaki siparişler için rezerve edilen alan (mal geldiğinde yer olsun). */
  reservedCapacity() {
    return this.data.purchaseOrders.reduce((s, o) => s + o.qty, 0);
  },
  /** Yeni alım/sipariş için gerçekten kullanılabilir alan. */
  availableCapacity() {
    return Math.max(0, this.capacity() - this.usedCapacity() - this.reservedCapacity());
  },
  /** Geriye dönük ad: spot alım da rezervasyonu dikkate alır. */
  freeCapacity() { return this.availableCapacity(); },

  /** Belirli üründen yolda olan miktar. */
  inTransitQty(productId) {
    return this.data.purchaseOrders
      .filter((o) => o.product === productId)
      .reduce((s, o) => s + o.qty, 0);
  },
  /** Yoldaki malın maliyet değeri (henüz kâr/zarara girmez). */
  inTransitValue() {
    return Utils.round2(this.data.purchaseOrders.reduce((s, o) => s + o.totalCost, 0));
  },

  inventoryValue() {
    return CONFIG.PRODUCTS.reduce(
      (s, p) => s + this.data.inventory[p.id].qty * this.data.market[p.id].price, 0);
  },
  inventoryCost() {
    return CONFIG.PRODUCTS.reduce(
      (s, p) => s + this.data.inventory[p.id].qty * this.data.inventory[p.id].avgCost, 0);
  },
  /** Nakit + depodaki malın güncel değeri + yoldaki malın maliyet değeri. */
  companyValue() { return this.data.cash + this.inventoryValue() + this.inTransitValue(); },

  /** Aktif sözleşmeler için bu üründen toplam kaç ton taahhüt edildi. */
  committed(productId) {
    return this.data.contracts
      .filter((c) => c.product === productId)
      .reduce((s, c) => s + c.qty, 0);
  },
  /** Taahhütler düşüldükten sonra serbestçe satılabilir stok. */
  freeStock(productId) {
    return Math.max(0, this.holding(productId).qty - this.committed(productId));
  },

  /** Deterministik RNG (mulberry32) — seed state içinde saklanır. */
  rand() {
    this.data.seed = (this.data.seed + 0x6D2B79F5) >>> 0;
    let t = this.data.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  randRange(a, b) { return a + this.rand() * (b - a); },
  randInt(a, b) { return Math.floor(this.randRange(a, b + 1)); },
  /** Normal dağılım (Box-Muller) */
  randNormal() {
    let u = 0, v = 0;
    while (u === 0) u = this.rand();
    while (v === 0) v = this.rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
};

/* ===========================================================================
 * MarketSystem — fiyat modeli
 * Fiyat = önceki fiyat * (1 + mean-reversion + volatilite gürültüsü + olay etkisi)
 * Sonuç her ürünün mantıklı min/max aralığına kırpılır.
 * =========================================================================*/
const MarketSystem = {
  advanceDay() {
    const s = GameState.data;
    const decay = CONFIG.MARKET.MOMENTUM_DECAY;

    CONFIG.PRODUCTS.forEach((p) => {
      const m = s.market[p.id];
      m.prev = m.price;

      // Trend (momentum): AR(1) — birkaç gün süren yönelimler üretir,
      // böylece piyasa "rastgele zıplama" yerine dalgalar halinde hareket eder.
      m.momentum = m.momentum * decay + GameState.randNormal() * p.momentum;

      // Temel fiyata geri çekilme: trend sonsuza kadar sürmez.
      const reversion = p.reversion * ((p.base - m.price) / p.base);
      const noise = GameState.randNormal() * p.volatility;
      const eventDrift = EventSystem.driftFor(p.id);

      let next = m.price * (1 + reversion + m.momentum + noise + eventDrift);
      next = Utils.clamp(next, p.min, p.max);
      // Bant kenarında trendi kır, fiyat kenara yapışmasın.
      if (next <= p.min + 0.01 || next >= p.max - 0.01) m.momentum *= -0.35;

      m.price = Utils.round2(next);
      m.change = m.prev > 0 ? (m.price - m.prev) / m.prev : 0;

      m.history.push(m.price);
      if (m.history.length > CONFIG.MARKET.HISTORY_LEN) m.history.shift();
    });
  },

  trend(id) {
    const c = GameState.data.market[id].change;
    if (c > 0.0015) return "up";
    if (c < -0.0015) return "down";
    return "flat";
  },

  /** Sparkline SVG (küçük fiyat grafiği) */
  sparkline(id, w, h) {
    const hist = GameState.data.market[id].history;
    if (hist.length < 2) return '<svg class="spark" width="' + w + '" height="' + h + '"></svg>';
    const pts = hist.slice(-CONFIG.MARKET.HISTORY_LEN);
    const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    const span = (max - min) || 1;
    const step = w / (pts.length - 1);
    const coords = pts.map((v, i) => {
      const x = i * step;
      const y = h - 2 - ((v - min) / span) * (h - 4);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    const up = pts[pts.length - 1] >= pts[0];
    const col = up ? "#22D07E" : "#FF5C7C";
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + coords + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/></svg>';
  }
};

/* ===========================================================================
 * InventorySystem — stok + ağırlıklı ortalama maliyet
 * =========================================================================*/
const InventorySystem = {
  /** Ağırlıklı ortalama maliyet: (eskiToplam + yeniToplam) / (eskiAdet + yeniAdet) */
  add(id, qty, unitPrice) {
    const h = GameState.data.inventory[id];
    const totalCost = h.qty * h.avgCost + qty * unitPrice;
    const totalQty = h.qty + qty;
    h.qty = totalQty;
    h.avgCost = totalQty > 0 ? Utils.round2(totalCost / totalQty) : 0;
  },

  /** Stoktan düşer, gerçekleşen kâr/zararı döndürür. Ortalama maliyet değişmez. */
  remove(id, qty, unitPrice) {
    const h = GameState.data.inventory[id];
    const sold = Math.min(qty, h.qty);
    const realized = Utils.round2((unitPrice - h.avgCost) * sold);
    h.qty -= sold;
    if (h.qty <= 0) { h.qty = 0; h.avgCost = 0; }
    return realized;
  },

  unrealized(id) {
    const h = GameState.data.inventory[id];
    if (h.qty <= 0) return 0;
    return Utils.round2((GameState.price(id) - h.avgCost) * h.qty);
  },
  unrealizedPct(id) {
    const h = GameState.data.inventory[id];
    if (h.qty <= 0 || h.avgCost <= 0) return 0;
    return (GameState.price(id) - h.avgCost) / h.avgCost;
  },
  hasAny() { return GameState.usedCapacity() > 0; }
};

/* ===========================================================================
 * TradingSystem — al/sat + işlem kaydı
 * Tüm işlemler { ok, reason } döndürür; UI hata mesajını gösterir.
 * =========================================================================*/
const TradingSystem = {
  maxBuy(id) {
    const price = GameState.price(id);
    if (price <= 0) return 0;
    const byCash = Math.floor(GameState.data.cash / price);
    const bySpace = GameState.freeCapacity();
    return Math.max(0, Math.min(byCash, bySpace));
  },
  maxSell(id) { return GameState.holding(id).qty; },

  buy(id, qty) {
    qty = Math.floor(qty);
    if (!(qty > 0)) return { ok: false, reason: "Geçersiz miktar" };
    const price = GameState.price(id);
    const cost = Utils.round2(price * qty);
    if (cost > GameState.data.cash + 0.001) return { ok: false, reason: "Yetersiz nakit" };
    if (qty > GameState.freeCapacity()) return { ok: false, reason: "Depoda yeterli alan yok" };

    const s = GameState.data;
    s.cash = Utils.round2(s.cash - cost);
    InventorySystem.add(id, qty, price);
    s.stats.totalTrades++;
    s.stats.totalBought += qty;
    this.log({ type: "buy", product: id, qty: qty, price: price, total: cost, day: s.day });
    SaveSystem.save();
    return { ok: true, qty: qty, price: price, total: cost };
  },

  sell(id, qty) {
    qty = Math.floor(qty);
    if (!(qty > 0)) return { ok: false, reason: "Geçersiz miktar" };
    const h = GameState.holding(id);
    if (qty > h.qty) return { ok: false, reason: "Yeterli stok yok" };

    const s = GameState.data;
    const price = GameState.price(id);
    const proceeds = Utils.round2(price * qty);
    const avgCost = h.avgCost;
    const realized = InventorySystem.remove(id, qty, price);

    s.cash = Utils.round2(s.cash + proceeds);
    s.stats.realizedProfit = Utils.round2(s.stats.realizedProfit + realized);
    s.stats.totalTrades++;
    s.stats.totalSold += qty;
    this.log({ type: "sell", product: id, qty: qty, price: price, total: proceeds,
               profit: realized, avgCost: avgCost, day: s.day });
    SaveSystem.save();
    return { ok: true, qty: qty, price: price, total: proceeds, profit: realized };
  },

  log(entry) {
    const s = GameState.data;
    s.transactions.unshift(entry);
    if (s.transactions.length > CONFIG.MARKET.TX_LOG_LEN) s.transactions.pop();
  }
};

/* ===========================================================================
 * EventSystem — haber üretimi ve piyasa etkisi
 * Bir haber 1-3 gün boyunca ilgili ürünün günlük fiyat sürüklenmesine eklenir.
 * =========================================================================*/
const EventSystem = {
  /** Yeni gün için haber çıkarmayı dener; çıkarsa haber nesnesini döndürür. */
  roll() {
    const s = GameState.data;
    if (GameState.rand() > CONFIG.EVENTS.CHANCE) return null;

    const busy = s.activeEvents.map((e) => e.product);
    const pool = CONFIG.EVENTS.POOL.filter((e) => busy.indexOf(e.product) === -1);
    if (!pool.length) return null;

    const def = pool[GameState.randInt(0, pool.length - 1)];
    const power = GameState.randRange(def.power[0], def.power[1]);
    const days = GameState.randInt(CONFIG.EVENTS.MIN_DAYS, CONFIG.EVENTS.MAX_DAYS);

    const ev = {
      key: def.id,
      title: def.title,
      body: def.body,
      product: def.product,
      dir: def.dir,
      impact: Utils.round2(def.dir * power * 100) / 100,
      daysLeft: days,
      duration: days,
      day: s.day
    };
    s.activeEvents.push(ev);
    s.news.unshift({
      title: ev.title, body: ev.body, product: ev.product,
      dir: ev.dir, day: ev.day, duration: days
    });
    if (s.news.length > CONFIG.MARKET.NEWS_FEED_LEN) s.news.pop();
    return ev;
  },

  /** O gün için ürüne uygulanacak toplam olay sürüklenmesi. */
  driftFor(productId) {
    return GameState.data.activeEvents
      .filter((e) => e.product === productId)
      .reduce((sum, e) => sum + e.impact, 0);
  },

  /** Fiyatlar hesaplandıktan sonra süreleri azalt, bitenleri temizle. */
  tick() {
    const s = GameState.data;
    s.activeEvents.forEach((e) => { e.daysLeft -= 1; });
    s.activeEvents = s.activeEvents.filter((e) => e.daysLeft > 0);
  },

  activeFor(productId) {
    return GameState.data.activeEvents.filter((e) => e.product === productId);
  }
};

/* ===========================================================================
 * CompanySystem — ünvan/seviye ve depo yükseltmeleri
 * =========================================================================*/
const CompanySystem = {
  tierIndex(value) {
    let idx = 0;
    CONFIG.TITLES.forEach((t, i) => { if (value >= t.min) idx = i; });
    return idx;
  },
  title(value) { return CONFIG.TITLES[this.tierIndex(value)].name; },
  level(value) { return this.tierIndex(value) + 1; },
  nextTier(value) {
    const i = this.tierIndex(value);
    return i < CONFIG.TITLES.length - 1 ? CONFIG.TITLES[i + 1] : null;
  },
  tierProgress(value) {
    const i = this.tierIndex(value);
    const cur = CONFIG.TITLES[i], nxt = CONFIG.TITLES[i + 1];
    if (!nxt) return 1;
    return Utils.clamp((value - cur.min) / (nxt.min - cur.min), 0, 1);
  },

  warehouse() { return CONFIG.WAREHOUSE[GameState.data.warehouseLevel - 1]; },
  nextWarehouse() { return CONFIG.WAREHOUSE[GameState.data.warehouseLevel] || null; },
  upgradeCost() { return this.warehouse().upgradeCost; },

  canUpgrade() {
    const cost = this.upgradeCost();
    return cost !== null && GameState.data.cash >= cost;
  },
  upgradeWarehouse() {
    const cost = this.upgradeCost();
    if (cost === null) return { ok: false, reason: "Depo zaten maksimum seviyede" };
    if (GameState.data.cash < cost) return { ok: false, reason: "Yetersiz nakit" };

    const s = GameState.data;
    s.cash = Utils.round2(s.cash - cost);
    s.warehouseLevel += 1;
    TradingSystem.log({
      type: "upgrade", day: s.day, total: cost,
      level: s.warehouseLevel, capacity: this.warehouse().capacity
    });
    SaveSystem.save();
    return { ok: true, cost: cost, capacity: this.warehouse().capacity, level: s.warehouseLevel };
  }
};

/* ===========================================================================
 * ReputationSystem — 0-100 arası itibar
 * İtibar; teklif sıklığını, sipariş büyüklüğünü, fiyat primini, aynı anda
 * taşınabilecek sözleşme sayısını ve hangi müşterilerin ulaştığını belirler.
 * =========================================================================*/
const ReputationSystem = {
  value() { return GameState.data.reputation; },

  /** 0-1 arası normalize itibar (denge formüllerinde kullanılır). */
  norm() {
    const R = CONFIG.CONTRACTS.REP;
    return (this.value() - R.MIN) / (R.MAX - R.MIN);
  },

  add(delta) {
    const R = CONFIG.CONTRACTS.REP;
    const before = GameState.data.reputation;
    GameState.data.reputation = Utils.clamp(Math.round(before + delta), R.MIN, R.MAX);
    return GameState.data.reputation - before;
  },

  tierIndex(value) {
    const v = (value === undefined) ? this.value() : value;
    let idx = 0;
    CONFIG.CONTRACTS.TIERS.forEach((t, i) => { if (v >= t.min) idx = i; });
    return idx;
  },
  tier() { return CONFIG.CONTRACTS.TIERS[this.tierIndex()]; },
  nextTier() {
    const i = this.tierIndex();
    return CONFIG.CONTRACTS.TIERS[i + 1] || null;
  }
};

/* ===========================================================================
 * ContractSystem — müşteriler, teklifler ve sözleşmeler
 * ---------------------------------------------------------------------------
 * Yaşam döngüsü:
 *   teklif (offers)  --kabul-->  aktif (contracts)  --teslim-->  tamamlandı
 *        |                            |
 *     süresi dolar               son gün geçer -> "gecikmiş" (ceza kesilir)
 *                                     |
 *                          telafi süresi dolar -> başarısız
 *
 * Teslimat depodan yapılır: sözleşme miktarının tamamı depoda olmalıdır.
 * Fiyat kabul anında sabitlenir; piyasa sonradan hareket eder, risk buradadır.
 * =========================================================================*/
const ContractSystem = {
  /* ---------------- limitler ---------------- */
  maxActive() { return CONFIG.CONTRACTS.MAX_ACTIVE[ReputationSystem.tierIndex()]; },
  activeCount() { return GameState.data.contracts.length; },
  hasSlot() { return this.activeCount() < this.maxActive(); },

  /* ---------------- teklif üretimi ---------------- */
  makeOffer() {
    const C = CONFIG.CONTRACTS;
    const s = GameState.data;
    const rep = ReputationSystem.norm();

    const capacity = GameState.capacity();

    // Karşılanabilirlik: sipariş, oyuncunun bugün finanse edebileceği hacimle
    // ve depo kapasitesiyle sınırlıdır. Pahalı ürünler böylece doğal olarak
    // oyuncu büyüdükçe devreye girer.
    const budget = Math.max(C.MIN_BUDGET, GameState.companyValue());
    const affordable = {};
    CONFIG.PRODUCTS.forEach((pr) => {
      const px = GameState.price(pr.id);
      affordable[pr.id] = px > 0
        ? Math.min(capacity, Math.floor((budget * C.BUDGET_SHARE) / px)) : 0;
    });

    // İtibarı yeten ve siparişi karşılanabilir müşteri/ürün eşleşmeleri
    const pairs = [];
    C.CUSTOMERS.forEach((c) => {
      if (s.reputation < c.minRep) return;
      c.products.forEach((pid) => { if (affordable[pid] >= 1) pairs.push({ cust: c, pid: pid }); });
    });
    if (!pairs.length) return null;

    const pick = pairs[GameState.randInt(0, pairs.length - 1)];
    const cust = pick.cust;
    const productId = pick.pid;
    const p = GameState.product(productId);
    if (!p) return null;

    const market = GameState.price(productId);

    // Miktar: ürün aralığı × itibar çarpanı × müşteri ölçeği; depo ve bütçeye sığdırılır.
    const range = C.QTY[productId] || [5, 30];
    const scale = Utils.lerp(C.QTY_REP_SCALE[0], C.QTY_REP_SCALE[1], rep) * cust.scale;
    let qty = Math.round(GameState.randRange(range[0], range[1]) * scale);
    qty = Utils.clamp(qty, 1, Math.min(capacity, affordable[productId]));

    // Teslim süresi
    const days = GameState.randInt(C.DEADLINE[0], C.DEADLINE[1]);

    // Prim: kısa süre primi artırır, büyük hacim primi düşürür (toptan indirimi).
    const lo = Utils.lerp(C.PREMIUM_LOW[0], C.PREMIUM_HIGH[0], rep);
    const hi = Utils.lerp(C.PREMIUM_LOW[1], C.PREMIUM_HIGH[1], rep);
    const tight = 1 - (days - C.DEADLINE[0]) / Math.max(1, C.DEADLINE[1] - C.DEADLINE[0]);
    const bulk = Utils.clamp(qty / Math.max(1, capacity), 0, 1);
    const t = Utils.clamp(0.30 * GameState.rand() + 0.45 * tight + 0.25 * (1 - bulk), 0, 1);
    const premium = Utils.lerp(lo, hi, t);

    const unitPrice = Math.max(0.01, Utils.round2(market * (1 + premium)));
    const value = Utils.round2(unitPrice * qty);
    const penalty = Utils.round2(value * GameState.randRange(C.PENALTY_PCT[0], C.PENALTY_PCT[1]));

    return {
      id: s.contractSeq++,
      customer: cust.name,
      sector: cust.sector,
      product: productId,
      qty: qty,
      unitPrice: unitPrice,
      marketAtOffer: market,
      premium: premium,
      days: days,
      value: value,
      penalty: penalty,
      expiresIn: GameState.randInt(C.OFFER_EXPIRY[0], C.OFFER_EXPIRY[1]),
      createdDay: s.day
    };
  },

  /** Her yeni günde: süresi dolan teklifleri at, yeni teklif üretmeyi dene. */
  rollOffers() {
    const C = CONFIG.CONTRACTS;
    const s = GameState.data;
    const expired = [];

    s.offers.forEach((o) => { o.expiresIn -= 1; });
    s.offers = s.offers.filter((o) => {
      if (o.expiresIn > 0) return true;
      expired.push(o);
      return false;
    });

    let created = null;
    if (s.offers.length < C.MAX_OFFERS) {
      const chance = Utils.lerp(C.OFFER_CHANCE[0], C.OFFER_CHANCE[1], ReputationSystem.norm());
      if (GameState.rand() < chance) {
        created = this.makeOffer();
        if (created) s.offers.push(created);
      }
    }
    return { created: created, expired: expired };
  },

  /* ---------------- teklif kararları ---------------- */
  accept(offerId) {
    const s = GameState.data;
    const i = s.offers.findIndex((o) => o.id === offerId);
    if (i < 0) return { ok: false, reason: "Teklif artık geçerli değil" };
    if (!this.hasSlot()) {
      return { ok: false, reason: "Aktif sözleşme limiti dolu (" + this.maxActive() + ")" };
    }
    const o = s.offers.splice(i, 1)[0];
    const c = {
      id: o.id,
      customer: o.customer, sector: o.sector,
      product: o.product, qty: o.qty,
      unitPrice: o.unitPrice, marketAtOffer: o.marketAtOffer, premium: o.premium,
      value: o.value, penalty: o.penalty,
      status: "active",
      daysLeft: o.days, totalDays: o.days,
      graceLeft: CONFIG.CONTRACTS.GRACE_DAYS,
      penaltyPaid: false,
      acceptedDay: s.day
    };
    s.contracts.push(c);
    SaveSystem.save();
    return { ok: true, contract: c };
  },

  reject(offerId) {
    const s = GameState.data;
    const i = s.offers.findIndex((o) => o.id === offerId);
    if (i < 0) return { ok: false, reason: "Teklif artık geçerli değil" };
    const o = s.offers.splice(i, 1)[0];
    SaveSystem.save();
    return { ok: true, offer: o };
  },

  /* ---------------- teslimat ---------------- */
  contract(id) { return GameState.data.contracts.find((c) => c.id === id) || null; },
  canDeliver(c) { return !!c && GameState.holding(c.product).qty >= c.qty; },
  /** Sözleşmeyi karşılamak için piyasadan alınması gereken miktar. */
  shortfall(productId) {
    return Math.max(0, GameState.committed(productId) - GameState.holding(productId).qty);
  },

  deliver(id) {
    const s = GameState.data;
    const idx = s.contracts.findIndex((c) => c.id === id);
    if (idx < 0) return { ok: false, reason: "Sözleşme bulunamadı" };
    const c = s.contracts[idx];
    const have = GameState.holding(c.product).qty;
    if (have < c.qty) {
      return { ok: false, reason: "Depoda " + Utils.qty(c.qty - have) + " ton eksik" };
    }

    const late = c.status === "overdue";
    const realized = InventorySystem.remove(c.product, c.qty, c.unitPrice);
    s.cash = Utils.round2(s.cash + c.value);
    s.stats.realizedProfit = Utils.round2(s.stats.realizedProfit + realized);
    s.stats.contractRevenue = Utils.round2(s.stats.contractRevenue + c.value);
    s.stats.contractsDone += 1;
    if (late) s.stats.contractsLate += 1;

    const repDelta = ReputationSystem.add(late ? CONFIG.CONTRACTS.REP.LATE : CONFIG.CONTRACTS.REP.DELIVER);

    s.contracts.splice(idx, 1);
    this.log({
      result: late ? "late" : "done", customer: c.customer, product: c.product,
      qty: c.qty, unitPrice: c.unitPrice, value: c.value, profit: realized,
      penalty: late ? c.penalty : 0, rep: repDelta, day: s.day
    });
    TradingSystem.log({
      type: "contract", product: c.product, qty: c.qty, price: c.unitPrice,
      total: c.value, profit: realized, customer: c.customer, late: late, day: s.day
    });
    SaveSystem.save();
    return { ok: true, contract: c, profit: realized, value: c.value, late: late, rep: repDelta };
  },

  cancel(id) {
    const s = GameState.data;
    const idx = s.contracts.findIndex((c) => c.id === id);
    if (idx < 0) return { ok: false, reason: "Sözleşme bulunamadı" };
    const c = s.contracts[idx];

    const charged = c.penaltyPaid ? 0 : c.penalty;
    if (charged > 0) this.chargePenalty(c);
    const repDelta = ReputationSystem.add(CONFIG.CONTRACTS.REP.CANCEL);
    s.stats.contractsFailed += 1;

    s.contracts.splice(idx, 1);
    this.log({
      result: "cancelled", customer: c.customer, product: c.product, qty: c.qty,
      unitPrice: c.unitPrice, value: c.value, profit: 0,
      penalty: c.penalty, rep: repDelta, day: s.day
    });
    SaveSystem.save();
    return { ok: true, contract: c, penalty: charged, rep: repDelta };
  },

  /** Cezayı bir kez keser; nakit yetmezse bakiye eksiye düşebilir (borç). */
  chargePenalty(c) {
    if (c.penaltyPaid) return 0;
    const s = GameState.data;
    c.penaltyPaid = true;
    s.cash = Utils.round2(s.cash - c.penalty);
    s.stats.penaltiesPaid = Utils.round2(s.stats.penaltiesPaid + c.penalty);
    s.stats.realizedProfit = Utils.round2(s.stats.realizedProfit - c.penalty);
    TradingSystem.log({
      type: "penalty", day: s.day, total: c.penalty,
      customer: c.customer, product: c.product, qty: c.qty
    });
    return c.penalty;
  },

  /** Gün ilerlediğinde süreleri işletir; UI'a bildirilecek olayları döndürür. */
  tickDay() {
    const s = GameState.data;
    const events = [];
    const survivors = [];

    s.contracts.forEach((c) => {
      if (c.status === "active") {
        // daysLeft === 0 "son teslim günü"dür ve hâlâ aktiftir: oyuncu o günün
        // tamamını kullanıp zamanında teslim edebilir. Gecikme ancak son gün de
        // geçtikten sonra, yani daysLeft sıfırın altına düştüğünde başlar.
        c.daysLeft -= 1;
        if (c.daysLeft < 0) {
          c.daysLeft = 0;
          c.status = "overdue";
          c.graceLeft = CONFIG.CONTRACTS.GRACE_DAYS;
          this.chargePenalty(c);
          events.push({ type: "overdue", contract: c, penalty: c.penalty });
        }
        survivors.push(c);
        return;
      }
      // gecikmiş: telafi süresi işliyor
      c.graceLeft -= 1;
      if (c.graceLeft <= 0) {
        const repDelta = ReputationSystem.add(CONFIG.CONTRACTS.REP.CANCEL);
        s.stats.contractsFailed += 1;
        this.log({
          result: "failed", customer: c.customer, product: c.product, qty: c.qty,
          unitPrice: c.unitPrice, value: c.value, profit: 0,
          penalty: c.penalty, rep: repDelta, day: s.day
        });
        events.push({ type: "failed", contract: c, rep: repDelta });
        return; // listeden düşer
      }
      survivors.push(c);
    });

    s.contracts = survivors;
    return events;
  },

  log(entry) {
    const s = GameState.data;
    s.contractLog.unshift(entry);
    if (s.contractLog.length > CONFIG.CONTRACTS.HISTORY_LEN) s.contractLog.pop();
  },

  /** Dikkat isteyen sözleşme sayısı (son gün, gecikmiş veya teslime hazır). */
  urgentCount() {
    return GameState.data.contracts.filter(
      (c) => c.status === "overdue" || c.daysLeft <= 1 || this.canDeliver(c)).length;
  }
};

/* ===========================================================================
 * ProcurementSystem — tedarikçiler, günlük teklifler ve satın alma siparişleri
 * ---------------------------------------------------------------------------
 * Akış:
 *   günlük teklif (fiyat piyasadan türetilir, gün boyunca sabit)
 *        |
 *     sipariş ver  -> nakit ANINDA düşer, mal YOLA çıkar (in_transit)
 *        |            depo kapasitesi sipariş anında rezerve edilir
 *   her gün daysLeft azalır
 *        |
 *   daysLeft 0 -> mal depoya girer (InventorySystem.add ile ağırlıklı ortalama)
 *
 * Teslimatta ikinci kez nakit hareketi olmaz; ödeme sipariş anında yapılmıştır.
 * =========================================================================*/
const ProcurementSystem = {
  suppliers() { return CONFIG.PROCUREMENT.SUPPLIERS; },
  supplier(id) { return CONFIG.PROCUREMENT.SUPPLIERS.find((x) => x.id === id) || null; },
  suppliersFor(productId) {
    return CONFIG.PROCUREMENT.SUPPLIERS.filter((x) => x.products.indexOf(productId) !== -1);
  },

  /* ---------------- günlük fiyat teklifleri ---------------- */

  /** O gün için tüm tedarikçi fiyatlarını üretir (piyasa fiyatından türetilir). */
  buildQuotes() {
    const prices = {};
    CONFIG.PROCUREMENT.SUPPLIERS.forEach((sup) => {
      const row = {};
      sup.products.forEach((pid) => {
        const market = GameState.price(pid);
        const disc = GameState.randRange(sup.discount[0], sup.discount[1]);
        row[pid] = Math.max(0.01, Utils.round2(market * (1 - disc)));
      });
      prices[sup.id] = row;
    });
    return { day: GameState.data.day, prices: prices };
  },

  /** Teklifler yoksa veya gün değiştiyse yeniden üretir. Aynı gün içinde sabit. */
  ensureQuotes() {
    const s = GameState.data;
    if (!s.supplierQuotes || s.supplierQuotes.day !== s.day) {
      s.supplierQuotes = this.buildQuotes();
      return true;
    }
    return false;
  },

  quote(supplierId, productId) {
    const q = GameState.data.supplierQuotes;
    if (!q || !q.prices[supplierId]) return null;
    const v = q.prices[supplierId][productId];
    return (typeof v === "number" && isFinite(v) && v > 0) ? v : null;
  },

  /** Spot fiyata göre fark (negatif = tedarikçi daha ucuz). */
  delta(supplierId, productId) {
    const price = this.quote(supplierId, productId);
    const market = GameState.price(productId);
    if (price === null || !market) return 0;
    return (price - market) / market;
  },

  /* ---------------- sipariş verilebilirlik ---------------- */

  /** Nakit ve kullanılabilir kapasiteye göre şu an alınabilecek en yüksek miktar. */
  maxOrder(supplierId, productId) {
    const price = this.quote(supplierId, productId);
    if (price === null || price <= 0) return 0;
    const byCash = Math.floor(GameState.data.cash / price);
    const bySpace = GameState.availableCapacity();
    return Math.max(0, Math.min(byCash, bySpace));
  },

  canOrder(supplierId, productId) {
    const sup = this.supplier(supplierId);
    if (!sup) return false;
    return this.maxOrder(supplierId, productId) >= sup.minQty;
  },

  /* ---------------- sipariş oluşturma ---------------- */
  order(supplierId, productId, qty) {
    const s = GameState.data;
    const sup = this.supplier(supplierId);
    if (!sup) return { ok: false, reason: "Tedarikçi bulunamadı" };
    if (sup.products.indexOf(productId) === -1) return { ok: false, reason: "Bu tedarikçide bu ürün yok" };

    qty = Math.floor(qty);
    if (!(qty > 0)) return { ok: false, reason: "Geçersiz miktar" };
    if (qty < sup.minQty) return { ok: false, reason: "Minimum sipariş " + Utils.qty(sup.minQty) + " ton" };

    const price = this.quote(supplierId, productId);
    if (price === null) return { ok: false, reason: "Bugün için fiyat teklifi yok" };

    const total = Utils.round2(price * qty);
    if (total > s.cash + 0.001) return { ok: false, reason: "Yetersiz nakit" };
    if (qty > GameState.availableCapacity()) return { ok: false, reason: "Depoda yeterli boş alan yok" };

    // Ödeme sipariş anında yapılır; mal henüz depoya girmez.
    s.cash = Utils.round2(s.cash - total);

    const po = {
      id: s.purchaseSeq++,
      supplierId: sup.id,
      supplierName: sup.name,
      product: productId,
      qty: qty,
      unitPrice: price,           // sipariş anında kilitlenir
      totalCost: total,
      orderedDay: s.day,
      leadTime: sup.leadTime,
      daysLeft: sup.leadTime,
      status: "in_transit"
    };
    s.purchaseOrders.push(po);

    s.stats.poCount += 1;
    s.stats.poTons += qty;
    s.stats.poSpent = Utils.round2(s.stats.poSpent + total);

    TradingSystem.log({
      type: "po", product: productId, qty: qty, price: price, total: total,
      supplier: sup.name, leadTime: sup.leadTime, day: s.day
    });
    SaveSystem.save();
    return { ok: true, order: po };
  },

  /* ---------------- gün ilerlemesi ---------------- */

  /** Süreleri azaltır; o gün ulaşan malları depoya alır. Ulaşanları döndürür. */
  tickDay() {
    const s = GameState.data;
    const arrived = [];
    const stillMoving = [];

    s.purchaseOrders.forEach((o) => {
      o.daysLeft -= 1;
      if (o.daysLeft > 0) { stillMoving.push(o); return; }

      // Mal depoya girer: ağırlıklı ortalama maliyet mevcut sistemle hesaplanır.
      o.daysLeft = 0;
      o.status = "delivered";
      o.deliveredDay = s.day;
      InventorySystem.add(o.product, o.qty, o.unitPrice);
      arrived.push(o);

      s.purchaseHistory.unshift(o);
      if (s.purchaseHistory.length > CONFIG.PROCUREMENT.HISTORY_LEN) s.purchaseHistory.pop();
    });

    s.purchaseOrders = stillMoving;
    return arrived;
  },

  /* ---------------- sözleşme entegrasyonu ---------------- */

  /** Bu üründe teslim baskısı en yüksek aktif sözleşme. */
  nearestContract(productId) {
    const rank = (c) => (c.status === "overdue" ? -1000 + c.graceLeft : c.daysLeft);
    let best = null;
    GameState.data.contracts.forEach((c) => {
      if (c.product !== productId) return;
      if (!best || rank(c) < rank(best)) best = c;
    });
    return best;
  },

  /**
   * Verilen teslim süresi, sözleşmeye yetişir mi?
   *   none  — o üründe sözleşme yok
   *   ok    — zamanında teslime yetişir
   *   grace — telafi süresine yetişir (geç teslim olur)
   *   late  — hiçbirine yetişmez
   * Bu yalnızca karar desteğidir; sipariş vermeyi engellemez.
   */
  contractFit(productId, leadTime) {
    const c = this.nearestContract(productId);
    if (!c) return { state: "none", contract: null };
    if (c.status === "overdue") {
      // Sözleşme graceLeft gün daha ayakta kalır; mal leadTime gün sonra gelir.
      return { state: leadTime <= c.graceLeft - 1 ? "grace" : "late", contract: c };
    }
    return { state: leadTime <= c.daysLeft ? "ok" : "late", contract: c };
  }
};

/* ===========================================================================
 * SaveSystem — localStorage kalıcılığı
 * =========================================================================*/
const SaveSystem = {
  _timer: null,
  available: (function () {
    try {
      const k = "__te_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),

  save() {
    if (!this.available || !GameState.data) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.saveNow(), 120);
  },
  saveNow() {
    if (!this.available || !GameState.data) return;
    try {
      localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(GameState.data));
    } catch (e) { /* kota dolu vb. — oyun bellekte devam eder */ }
  },

  load() {
    if (!this.available) return null;
    let raw = null;
    try { raw = localStorage.getItem(CONFIG.SAVE_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try {
      const d = JSON.parse(raw);
      return this.migrate(d);
    } catch (e) { return null; }
  },

  /** Kayıt şemasını doğrular ve eksik alanları tamamlar (ileri sürüm uyumu). */
  migrate(d) {
    if (!d || typeof d !== "object") return null;
    const fresh = GameState.createNew();
    if (typeof d.day !== "number" || typeof d.cash !== "number") return null;

    const out = fresh;
    out.version = CONFIG.VERSION;
    out.seed = (typeof d.seed === "number") ? (d.seed >>> 0) : fresh.seed;
    out.day = Math.max(1, Math.floor(d.day));
    out.cash = Utils.round2(d.cash);
    out.warehouseLevel = Utils.clamp(Math.floor(d.warehouseLevel || 1), 1, CONFIG.WAREHOUSE.length);

    CONFIG.PRODUCTS.forEach((p) => {
      const m = d.market && d.market[p.id];
      if (m && typeof m.price === "number" && isFinite(m.price)) {
        out.market[p.id].price = Utils.clamp(Utils.round2(m.price), p.min, p.max);
        out.market[p.id].prev = (typeof m.prev === "number") ? m.prev : out.market[p.id].price;
        out.market[p.id].change = (typeof m.change === "number") ? m.change : 0;
        out.market[p.id].momentum = (typeof m.momentum === "number" && isFinite(m.momentum))
          ? Utils.clamp(m.momentum, -0.2, 0.2) : 0;
        out.market[p.id].history = Array.isArray(m.history) && m.history.length
          ? m.history.filter((x) => typeof x === "number" && isFinite(x)).slice(-CONFIG.MARKET.HISTORY_LEN)
          : [out.market[p.id].price];
      }
      const inv = d.inventory && d.inventory[p.id];
      if (inv && typeof inv.qty === "number") {
        out.inventory[p.id].qty = Math.max(0, Math.floor(inv.qty));
        out.inventory[p.id].avgCost = Math.max(0, Utils.round2(inv.avgCost || 0));
      }
    });

    out.activeEvents = Array.isArray(d.activeEvents)
      ? d.activeEvents.filter((e) => e && e.product && typeof e.impact === "number" && e.daysLeft > 0)
      : [];
    out.news = Array.isArray(d.news) ? d.news.slice(0, CONFIG.MARKET.NEWS_FEED_LEN) : [];
    out.transactions = Array.isArray(d.transactions) ? d.transactions.slice(0, CONFIG.MARKET.TX_LOG_LEN) : [];

    if (d.stats && typeof d.stats === "object") {
      out.stats.realizedProfit = Utils.round2(d.stats.realizedProfit || 0);
      out.stats.totalTrades = Math.max(0, Math.floor(d.stats.totalTrades || 0));
      out.stats.totalBought = Math.max(0, Math.floor(d.stats.totalBought || 0));
      out.stats.totalSold = Math.max(0, Math.floor(d.stats.totalSold || 0));
      out.stats.peakValue = Math.max(0, d.stats.peakValue || 0);
      out.stats.contractsDone = Math.max(0, Math.floor(d.stats.contractsDone || 0));
      out.stats.contractsLate = Math.max(0, Math.floor(d.stats.contractsLate || 0));
      out.stats.contractsFailed = Math.max(0, Math.floor(d.stats.contractsFailed || 0));
      out.stats.contractRevenue = Utils.round2(d.stats.contractRevenue || 0);
      out.stats.penaltiesPaid = Utils.round2(d.stats.penaltiesPaid || 0);
    }

    /* --- V2: sözleşmeler ve itibar (V1 kayıtlarında yok, varsayılana düşer) --- */
    const R = CONFIG.CONTRACTS.REP;
    out.reputation = (typeof d.reputation === "number" && isFinite(d.reputation))
      ? Utils.clamp(Math.round(d.reputation), R.MIN, R.MAX) : R.START;

    const validProduct = (id) => !!GameState.product(id);
    const num = (v, min, fallback) =>
      (typeof v === "number" && isFinite(v) && v >= min) ? v : fallback;

    out.offers = Array.isArray(d.offers) ? d.offers.filter((o) =>
      o && validProduct(o.product) && o.qty > 0 && o.unitPrice > 0 && o.expiresIn > 0
    ).slice(0, CONFIG.CONTRACTS.MAX_OFFERS).map((o) => ({
      id: num(o.id, 0, 0),
      customer: String(o.customer || "Bilinmeyen Müşteri"),
      sector: String(o.sector || ""),
      product: o.product,
      qty: Math.floor(o.qty),
      unitPrice: Utils.round2(o.unitPrice),
      marketAtOffer: num(o.marketAtOffer, 0, o.unitPrice),
      premium: num(o.premium, -1, 0),
      days: Math.max(1, Math.floor(o.days || 1)),
      value: Utils.round2(num(o.value, 0, o.unitPrice * o.qty)),
      penalty: Utils.round2(num(o.penalty, 0, 0)),
      expiresIn: Math.max(1, Math.floor(o.expiresIn)),
      createdDay: Math.max(1, Math.floor(o.createdDay || out.day))
    })) : [];

    out.contracts = Array.isArray(d.contracts) ? d.contracts.filter((c) =>
      c && validProduct(c.product) && c.qty > 0 && c.unitPrice > 0
    ).map((c) => ({
      id: num(c.id, 0, 0),
      customer: String(c.customer || "Bilinmeyen Müşteri"),
      sector: String(c.sector || ""),
      product: c.product,
      qty: Math.floor(c.qty),
      unitPrice: Utils.round2(c.unitPrice),
      marketAtOffer: num(c.marketAtOffer, 0, c.unitPrice),
      premium: num(c.premium, -1, 0),
      value: Utils.round2(num(c.value, 0, c.unitPrice * c.qty)),
      penalty: Utils.round2(num(c.penalty, 0, 0)),
      status: c.status === "overdue" ? "overdue" : "active",
      daysLeft: Math.max(0, Math.floor(num(c.daysLeft, 0, 1))),
      totalDays: Math.max(1, Math.floor(num(c.totalDays, 1, 1))),
      graceLeft: Math.max(0, Math.floor(num(c.graceLeft, 0, CONFIG.CONTRACTS.GRACE_DAYS))),
      penaltyPaid: c.penaltyPaid === true,
      acceptedDay: Math.max(1, Math.floor(c.acceptedDay || out.day))
    })) : [];

    out.contractLog = Array.isArray(d.contractLog)
      ? d.contractLog.slice(0, CONFIG.CONTRACTS.HISTORY_LEN) : [];

    // id sayacı her zaman mevcut en büyük id'nin üstünde kalmalı
    let maxId = 0;
    out.offers.concat(out.contracts).forEach((x) => { if (x.id > maxId) maxId = x.id; });
    out.contractSeq = Math.max(Math.floor(num(d.contractSeq, 1, 1)), maxId + 1);

    /* --- V2 Part 2: tedarik (eski kayıtlarda yok, güvenli varsayılana düşer) --- */
    out.stats.poCount = Math.max(0, Math.floor((d.stats && d.stats.poCount) || 0));
    out.stats.poTons = Math.max(0, Math.floor((d.stats && d.stats.poTons) || 0));
    out.stats.poSpent = Utils.round2((d.stats && d.stats.poSpent) || 0);

    /* Bir siparişin kanonik maliyeti her zaman qty x unitPrice'tır. Kayıttaki
       totalCost eksik, sayısal değil, sonsuz, sıfır/negatif ya da miktarla
       anlamlı şekilde tutarsızsa güvenle yeniden kurulur; böylece bozuk bir
       kayıt yüzünden yoldaki mal şirket değerinde 0 veya yanlış görünmez.
       Tutarlı kayıtlar olduğu gibi korunur. */
    const canonicalTotal = (raw, unitPrice, qty) => {
      const expected = Utils.round2(unitPrice * qty);
      if (typeof raw !== "number" || !isFinite(raw) || raw <= 0) return expected;
      const stored = Utils.round2(raw);
      const tolerance = Math.max(0.02, expected * 0.005);
      return Math.abs(stored - expected) > tolerance ? expected : stored;
    };

    const seenPo = {};
    out.purchaseOrders = Array.isArray(d.purchaseOrders) ? d.purchaseOrders.filter((o) => {
      if (!o || !validProduct(o.product)) return false;
      const sup = ProcurementSystem.supplier(o.supplierId);
      if (!sup) return false;
      if (!(o.qty > 0) || !(o.unitPrice > 0)) return false;
      if (!(o.leadTime >= 1) || !(o.daysLeft >= 1) || o.daysLeft > o.leadTime) return false;
      const id = Math.floor(num(o.id, 0, -1));
      if (id < 0 || seenPo[id]) return false;   // bozuk veya çift id
      seenPo[id] = true;
      return true;
    }).map((o) => {
      const qty = Math.floor(o.qty);
      const unitPrice = Utils.round2(o.unitPrice);
      return {
        id: Math.floor(o.id),
        supplierId: o.supplierId,
        supplierName: String(o.supplierName || ProcurementSystem.supplier(o.supplierId).name),
        product: o.product,
        qty: qty,
        unitPrice: unitPrice,
        totalCost: canonicalTotal(o.totalCost, unitPrice, qty),
        orderedDay: Math.max(1, Math.floor(o.orderedDay || out.day)),
        leadTime: Math.floor(o.leadTime),
        daysLeft: Math.floor(o.daysLeft),
        status: "in_transit"
      };
    }) : [];

    /* Geçmiş kayıtlar da aktif siparişlerle aynı titizlikte normalize edilir:
       ham obje taşınmaz, yeni nesne kurulur. Aynı id hem aktif hem geçmişte
       varsa aktif sipariş gerçek devam eden oyun state'idir; geçmiş kopya atılır. */
    out.purchaseHistory = [];
    if (Array.isArray(d.purchaseHistory)) {
      const seenHistory = {};
      d.purchaseHistory.forEach((o) => {
        if (out.purchaseHistory.length >= CONFIG.PROCUREMENT.HISTORY_LEN) return;
        if (!o || typeof o !== "object") return;
        if (!validProduct(o.product)) return;

        const sup = ProcurementSystem.supplier(o.supplierId);
        if (!sup) return;

        const id = Math.floor(num(o.id, 0, -1));
        if (id < 0 || seenHistory[id] || seenPo[id]) return;

        const qty = Math.floor(num(o.qty, 1, 0));
        if (!(qty > 0)) return;

        const unitPrice = Utils.round2(num(o.unitPrice, 0, 0));
        if (!(unitPrice > 0)) return;

        const leadTime = Math.floor(num(o.leadTime, 1, 0));
        if (!(leadTime >= 1)) return;

        const orderedDay = Math.floor(num(o.orderedDay, 1, 0));
        if (!(orderedDay >= 1)) return;

        const deliveredDay = Math.floor(num(o.deliveredDay, 1, 0));
        if (!(deliveredDay >= orderedDay)) return;

        seenHistory[id] = true;
        out.purchaseHistory.push({
          id: id,
          supplierId: sup.id,
          supplierName: String(o.supplierName || sup.name),
          product: o.product,
          qty: qty,
          unitPrice: unitPrice,
          totalCost: canonicalTotal(o.totalCost, unitPrice, qty),
          orderedDay: orderedDay,
          leadTime: leadTime,
          daysLeft: 0,
          status: "delivered",
          deliveredDay: deliveredDay
        });
      });
    }

    let maxPo = 0;
    out.purchaseOrders.concat(out.purchaseHistory).forEach((o) => { if (o.id > maxPo) maxPo = o.id; });
    out.purchaseSeq = Math.max(Math.floor(num(d.purchaseSeq, 1, 1)), maxPo + 1);

    // Günlük teklifler: yalnızca aynı güne ait ve geçerli olanlar korunur;
    // aksi hâlde açılışta yeniden üretilir (aynı gün reload fiyatı değiştirmez).
    out.supplierQuotes = null;
    const q = d.supplierQuotes;
    if (q && typeof q === "object" && q.day === out.day && q.prices && typeof q.prices === "object") {
      const prices = {};
      let sane = true;
      CONFIG.PROCUREMENT.SUPPLIERS.forEach((sup) => {
        const row = q.prices[sup.id];
        if (!row || typeof row !== "object") { sane = false; return; }
        const clean = {};
        sup.products.forEach((pid) => {
          const v = row[pid];
          if (typeof v !== "number" || !isFinite(v) || v <= 0) { sane = false; return; }
          clean[pid] = Utils.round2(v);
        });
        prices[sup.id] = clean;
      });
      if (sane) out.supplierQuotes = { day: out.day, prices: prices };
    }
    if (d.settings && typeof d.settings === "object") {
      out.settings.sound = d.settings.sound !== false;
    }
    return out;
  },

  clear() {
    if (!this.available) return;
    clearTimeout(this._timer);
    try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {}
  }
};

/* ===========================================================================
 * Audio — hafif WebAudio geri bildirimi (harici dosya yok)
 * =========================================================================*/
const Audio_ = {
  ctx: null,
  ensure() {
    if (!GameState.data || !GameState.data.settings.sound) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch (e) { return null; }
    }
    if (this.ctx.state === "suspended") { try { this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },
  tone(freq, dur, type, gain) {
    const ctx = this.ensure();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
    } catch (e) {}
  },
  tap()    { this.tone(420, 0.05, "sine", 0.03); },
  buy()    { this.tone(300, 0.09, "triangle", 0.05); setTimeout(() => this.tone(460, 0.11, "triangle", 0.05), 70); },
  profit() { this.tone(560, 0.09, "sine", 0.06); setTimeout(() => this.tone(760, 0.16, "sine", 0.055), 80); },
  loss()   { this.tone(300, 0.12, "sine", 0.05); setTimeout(() => this.tone(200, 0.2, "sine", 0.05), 90); },
  day()    { this.tone(500, 0.07, "sine", 0.04); setTimeout(() => this.tone(660, 0.12, "sine", 0.04), 80); },
  error()  { this.tone(180, 0.14, "square", 0.03); },
  upgrade(){ [520, 660, 830].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, "triangle", 0.05), i * 90)); },
  offer()  { this.tone(660, 0.08, "sine", 0.045); setTimeout(() => this.tone(880, 0.13, "sine", 0.04), 90); },
  arrival(){ this.tone(440, 0.09, "triangle", 0.05); setTimeout(() => this.tone(620, 0.14, "triangle", 0.045), 85); },
  contract(){ [620, 780, 990, 1240].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, "sine", 0.05), i * 85)); },
  haptic(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms || 10); } catch (e) {} } }
};

/* ===========================================================================
 * UI — render + etkileşim
 * =========================================================================*/
const UI = {
  currentTab: "market",
  tradeSegment: "offers",
  procProduct: "aluminum",
  sheet: { open: false, mode: "buy", productId: null, qty: 0 },
  flashPrices: false,

  el: {},

  init() {
    this.el = {
      day: $("#hDay"), rank: $("#hRank"),
      rep: $("#hRep"), repBar: $("#hRepBar"), badge: $("#tabBadge"),
      cash: $("#hCash"), value: $("#hValue"),
      main: $("#main"), dayBar: $("#dayBar"), tabbar: $("#tabbar"),
      sheet: $("#sheet"), backdrop: $("#backdrop"),
      fx: $("#fxLayer"), toast: $("#toastLayer"), dayFlash: $("#dayFlash")
    };
    this.bind();
  },

  /* ---------------- binding ---------------- */
  bind() {
    this.el.tabbar.addEventListener("click", (e) => {
      const t = e.target.closest(".tab");
      if (!t) return;
      Audio_.tap(); Audio_.haptic(8);
      this.switchTab(t.dataset.tab);
    });

    $("#nextDayBtn").addEventListener("click", () => Game.nextDay());

    this.el.main.addEventListener("click", (e) => {
      const a = e.target.closest("[data-action]");
      if (!a) return;
      e.preventDefault();
      this.handleAction(a.dataset.action, a.dataset);
    });

    this.el.sheet.addEventListener("click", (e) => {
      const a = e.target.closest("[data-sheet]");
      if (!a) return;
      e.preventDefault();
      this.handleSheetAction(a.dataset.sheet, a.dataset);
    });

    this.el.backdrop.addEventListener("click", () => this.closeSheet());

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && this.sheet.open) this.closeSheet();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") SaveSystem.saveNow();
    });
    window.addEventListener("pagehide", () => SaveSystem.saveNow());
  },

  handleAction(action, ds) {
    switch (action) {
      case "buy":     Audio_.tap(); this.openSheet("buy", ds.id); break;
      case "sell":    Audio_.tap(); this.openSheet("sell", ds.id); break;
      case "upgrade": this.doUpgrade(); break;
      case "goto":
        Audio_.tap();
        if (ds.seg) this.tradeSegment = ds.seg;
        this.switchTab(ds.tab);
        break;
      case "sound":   this.toggleSound(); break;
      case "newgame": this.confirmNewGame(); break;
      case "reset":   this.confirmReset(); break;
      case "seg":     Audio_.tap(); this.tradeSegment = ds.seg; this.el.main.scrollTop = 0; this.render(); break;
      case "procProduct": Audio_.tap(); this.procProduct = ds.id; this.render(); break;
      case "poOpen":      Audio_.tap(); this.openPoSheet(ds.sup, ds.id); break;
      case "offerAccept":    this.acceptOffer(parseInt(ds.id, 10)); break;
      case "offerReject":    this.rejectOffer(parseInt(ds.id, 10)); break;
      case "contractDeliver":this.deliverContract(parseInt(ds.id, 10)); break;
      case "contractCancel": this.confirmCancelContract(parseInt(ds.id, 10)); break;
    }
  },

  /* ---------------- tabs ---------------- */
  switchTab(tab) {
    if (!tab) return;
    this.currentTab = tab;
    $$(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
    $$(".screen").forEach((s) => s.classList.toggle("active", s.dataset.screen === tab));
    this.el.dayBar.classList.toggle("hidden", !(tab === "market" || tab === "warehouse"));
    this.el.main.scrollTop = 0;
    this.render();
  },

  /* ---------------- header ---------------- */
  renderHeader() {
    const s = GameState.data;
    const value = GameState.companyValue();
    this.el.day.textContent = s.day;
    this.el.rank.textContent = CompanySystem.title(value);
    this.animateNumber(this.el.cash, s.cash, Utils.moneyShort);
    this.animateNumber(this.el.value, value, Utils.moneyShort);
    this.el.cash.style.color = s.cash < 0 ? "var(--down)" : "";

    const rep = ReputationSystem.value();
    this.animateNumber(this.el.rep, rep, (v) => String(Math.round(v)));
    this.el.repBar.style.width = rep + "%";
    this.el.repBar.className = "repFill" + (rep < 25 ? " low" : rep >= 75 ? " high" : "");

    // Ticaret sekmesi rozeti: bekleyen teklif + ilgi bekleyen sözleşme
    const n = s.offers.length + ContractSystem.urgentCount();
    this.el.badge.hidden = n <= 0;
    this.el.badge.textContent = n > 9 ? "9+" : String(n);
  },

  animateNumber(el, to, fmt) {
    const prev = el.dataset.v !== undefined ? parseFloat(el.dataset.v) : to;
    el.dataset.v = to;
    if (!isFinite(prev) || Math.abs(to - prev) < 0.5) { el.textContent = fmt(to); return; }

    el.classList.remove("flashUp", "flashDown");
    void el.offsetWidth;
    el.classList.add(to > prev ? "flashUp" : "flashDown");

    const start = performance.now(), dur = 520;
    const step = (now) => {
      const t = Utils.clamp((now - start) / dur, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(prev + (to - prev) * e);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = fmt(to);
    };
    requestAnimationFrame(step);
  },

  /* ---------------- master render ---------------- */
  render() {
    this.renderHeader();
    switch (this.currentTab) {
      case "market":    this.renderMarket(); break;
      case "warehouse": this.renderWarehouse(); break;
      case "trades":    this.renderTrades(); break;
      case "company":   this.renderCompany(); break;
      case "profile":   this.renderProfile(); break;
    }
    if (this.sheet.open) this.renderSheet();
  },

  /* ---------------- components ---------------- */
  productIcon(p) {
    return '<div class="mktIcon" style="background:' + p.bg + ';color:' + p.color + '">' + p.code + '</div>';
  },

  newsCardHTML(n, compact) {
    const cls = n.dir > 0 ? "pos" : "neg";
    const arrow = n.dir > 0 ? "▲" : "▼";
    const prod = GameState.product(n.product);
    const pname = prod ? prod.name : "";
    if (compact) {
      return '<div class="newsCard ' + cls + '" style="padding:11px 12px 11px 14px">' +
        '<div class="newsTop"><span class="newsTag">' + arrow + " " + Utils.escape(pname) + '</span>' +
        '<span class="newsDay">Gün ' + n.day + '</span></div>' +
        '<div class="newsTitle" style="font-size:13.5px">' + Utils.escape(n.title) + '</div></div>';
    }
    return '<div class="newsCard ' + cls + '">' +
      '<div class="newsTop">' +
        '<span class="newsTag">PİYASA HABERİ</span>' +
        '<span class="newsTag">' + arrow + " " + Utils.escape(pname) + '</span>' +
        '<span class="newsDay">Gün ' + n.day + '</span>' +
      '</div>' +
      '<div class="newsTitle">' + Utils.escape(n.title) + '</div>' +
      '<div class="newsBody">' + Utils.escape(n.body) + '</div>' +
      '<div class="newsMeta">Etki süresi: ' + n.duration + ' gün</div>' +
    '</div>';
  },

  upgradeCardHTML() {
    const cur = CompanySystem.warehouse();
    const next = CompanySystem.nextWarehouse();
    const cash = GameState.data.cash;
    let inner = '<div class="rowBetween">' +
        '<div><div class="muted3">DEPO SEVİYESİ</div>' +
        '<div class="big">Seviye ' + cur.level + ' <span class="muted">· ' + Utils.qty(cur.capacity) + ' ton</span></div></div>' +
        '<div class="mktIcon" style="background:rgba(233,196,106,.12);color:#E9C46A">' + cur.level + '</div>' +
      '</div>' +
      '<div class="lvlDots">' + CONFIG.WAREHOUSE.map((w) =>
        '<div class="lvlDot' + (w.level <= cur.level ? " on" : "") + '"></div>').join("") + '</div>';

    if (!next) {
      inner += '<div class="muted" style="margin-top:12px">Depo maksimum seviyede. Yeni genişleme modülleri ileride eklenecek.</div>';
    } else {
      const cost = cur.upgradeCost;
      const can = cash >= cost;
      inner += '<div class="pRow" style="margin-top:10px;border-bottom:0;padding:10px 0 4px">' +
          '<span class="k">Sonraki seviye kapasitesi</span><span class="v">' + Utils.qty(next.capacity) + ' ton</span></div>' +
        '<div class="pRow" style="border-bottom:0;padding:0 0 12px">' +
          '<span class="k">Yükseltme bedeli</span><span class="v ' + (can ? "" : "down") + '">' + Utils.money(cost) + '</span></div>' +
        '<button class="btn gold" data-action="upgrade"' + (can ? "" : " disabled") + '>' +
          (can ? "DEPOYU GELİŞTİR" : "YETERSİZ NAKİT") + '</button>';
    }
    return '<div class="upgCard">' + inner + '</div>';
  },

  reputationCardHTML() {
    const s = GameState.data;
    const rep = ReputationSystem.value();
    const tier = ReputationSystem.tier();
    const next = ReputationSystem.nextTier();
    const cls = rep < 25 ? "low" : rep >= 75 ? "high" : "";
    const done = s.stats.contractsDone, failed = s.stats.contractsFailed;
    const rate = (done + failed) > 0 ? Math.round(done / (done + failed) * 100) : null;

    return '<div class="repCard">' +
      '<div class="rowBetween">' +
        '<div><div class="muted3">İTİBAR</div>' +
        '<div class="repBig num" style="color:' + (rep < 25 ? "var(--down)" : rep >= 75 ? "var(--up)" : "var(--gold)") + '">' +
          rep + '<span class="muted" style="font-size:15px"> / 100</span></div></div>' +
        '<div style="text-align:right"><div class="muted3">KADEME</div>' +
        '<div style="font-size:14px;font-weight:800;margin-top:3px">' + tier.short + '</div></div>' +
      '</div>' +
      '<div class="repTrack" style="height:8px;margin-top:11px"><div class="repFill ' + cls +
        '" style="width:' + rep + '%"></div></div>' +
      '<div class="muted3" style="margin-top:8px">' +
        (next ? "Sonraki kademe: " + next.short + " · " + next.min + " itibar"
              : "En yüksek kademedesin") +
      '</div>' +
      '<div class="holdGrid">' +
        '<div class="kv"><div class="k">Aktif Sözleşme Limiti</div><div class="v num">' +
          ContractSystem.activeCount() + ' / ' + ContractSystem.maxActive() + '</div></div>' +
        '<div class="kv"><div class="k">Teslim Başarısı</div><div class="v num">' +
          (rate === null ? "—" : rate + "%") + '</div></div>' +
      '</div>' +
      '<div class="muted3" style="margin-top:10px;line-height:1.5">' +
        'Zamanında teslim +3 · geç teslim ' + CONFIG.CONTRACTS.REP.LATE +
        ' · iptal ' + CONFIG.CONTRACTS.REP.CANCEL + ' itibar. ' +
        'İtibar yükseldikçe daha büyük müşteriler, daha yüksek prim ve daha çok eşzamanlı sözleşme açılır.' +
      '</div>' +
      '<div class="tierList" style="margin-top:12px;border-top:1px solid var(--line);padding-top:4px">' +
        CONFIG.CONTRACTS.TIERS.map((t, i) => {
          const on = i === ReputationSystem.tierIndex();
          const limit = CONFIG.CONTRACTS.MAX_ACTIVE[i];

            '<div class="tierName">' + t.short + '</div>' +
            '<div class="tierReq num">' + t.min + '+ · ' + limit + ' sözleşme</div></div>';
        }).join("") +
      '</div>' +
    '</div>';
  },

  /* ---------------- screen: PİYASA ---------------- */
  renderMarket() {
    const s = GameState.data;
    let html = "";

    // Süresi daralan sözleşmeler ana ekranda görünür: "Sonraki Gün" bir karara dönüşür.
    const urgent = s.contracts.filter((c) => c.status === "overdue" || c.daysLeft <= 2);
    if (urgent.length) {
      html += '<div class="sectionTitle"><h2>Süre Daralıyor</h2>' +
        '<span class="hint">' + urgent.length + ' sözleşme</span></div>';
      html += urgent.map((c) => {
        const p = GameState.product(c.product);
        const need = Math.max(0, c.qty - GameState.holding(c.product).qty);
        const ready = need <= 0;
        return '<div class="ctr ' + (c.status === "overdue" ? "overdue" : ready ? "ready" : "warn") +
          '" style="padding:11px 12px" data-action="goto" data-tab="trades" data-seg="active" role="button">' +
          '<div class="ctrHead">' +
            this.productIcon(p) +
            '<div class="ctrWho"><div class="ctrCust" style="font-size:13.5px">' + Utils.escape(c.customer) + '</div>' +
            '<div class="ctrSector num">' + Utils.qty(c.qty) + ' ton ' + p.name +
              (ready ? ' · teslime hazır' : ' · ' + Utils.qty(need) + ' ton eksik') + '</div></div>' +
            this.deadlineChip(c) +
          '</div>' +
        '</div>';
      }).join("");
    }

    const todays = s.news.filter((n) => n.day === s.day);
    if (todays.length) {
      html += '<div class="sectionTitle"><h2>Günün Haberi</h2></div>';
      html += todays.map((n) => this.newsCardHTML(n, false)).join("");
    }

    html += '<div class="sectionTitle"><h2>Piyasa</h2><span class="hint">Gün ' + s.day + '</span></div>';

    html += CONFIG.PRODUCTS.map((p) => {
      const m = s.market[p.id];
      const h = s.inventory[p.id];
      const trend = MarketSystem.trend(p.id);
      const arrow = trend === "up" ? "▲" : trend === "down" ? "▼" : "▬";
      const flash = this.flashPrices ? (trend === "up" ? " flashUp" : trend === "down" ? " flashDown" : "") : "";
      const events = EventSystem.activeFor(p.id);

      let holdRow = "";
      const bits = [];
      if (h.qty > 0) {
        const pl = InventorySystem.unrealized(p.id);
        bits.push('<span class="pill">Stok <b>' + Utils.qty(h.qty) + ' ' + p.unit + '</b></span>');
        bits.push('<span class="pill">Ort. <b>' + Utils.price(h.avgCost) + '</b></span>');
        bits.push('<span class="pill ' + (pl >= 0 ? "up" : "down") + '">' + Utils.moneySigned(pl) + '</span>');
      }
      const onWay = GameState.inTransitQty(p.id);
      if (onWay > 0) bits.push('<span class="pill">Yolda <b>' + Utils.qty(onWay) + ' ton</b></span>');
      const committed = GameState.committed(p.id);
      if (committed > 0) {
        const missing = ContractSystem.shortfall(p.id);
        bits.push(missing > 0
          ? '<span class="pill down">Sözleşme · <b>' + Utils.qty(missing) + ' ton eksik</b></span>'
          : '<span class="pill up">Sözleşme · ' + Utils.qty(committed) + ' ton hazır</span>');
      }
      events.forEach((e) => {
        bits.push('<span class="pill ' + (e.dir > 0 ? "up" : "down") + '">Haber etkisi · ' + e.daysLeft + ' gün</span>');
      });
      if (bits.length) holdRow = '<div class="mktHold">' + bits.join("") + '</div>';

      return '<div class="mkt" role="button" data-action="buy" data-id="' + p.id + '">' +
        '<div class="mktTop">' +
          this.productIcon(p) +
          '<div class="mktNames">' +
            '<div class="mktName">' + p.name + '</div>' +
            '<div class="mktPrice num' + flash + '">' + Utils.price(m.price) + '<small>/' + p.unit + '</small></div>' +
          '</div>' +
          '<div class="mktRight">' +
            '<span class="chg ' + trend + '">' + arrow + " " + Utils.pct(m.change) + '</span>' +
            MarketSystem.sparkline(p.id, 74, 28) +
          '</div>' +
        '</div>' +
        holdRow +
        '<div class="mktBtns">' +
          '<button class="btn primary" data-action="buy" data-id="' + p.id + '">SATIN AL</button>' +
          (h.qty > 0 ? '<button class="btn sell" data-action="sell" data-id="' + p.id + '">SAT</button>' : "") +
        '</div>' +
      '</div>';
    }).join("");

    const older = s.news.filter((n) => n.day !== s.day).slice(0, 4);
    if (older.length) {
      html += '<div class="sectionTitle" style="margin-top:18px"><h2>Haber Akışı</h2></div>';
      html += older.map((n) => this.newsCardHTML(n, true)).join("");
    }

    $("#screenMarket").innerHTML = html;
    this.flashPrices = false;
  },

  /* ---------------- screen: DEPO ---------------- */
  renderWarehouse() {
    const s = GameState.data;
    const cap = GameState.capacity(), used = GameState.usedCapacity();
    const reserved = GameState.reservedCapacity();
    const avail = GameState.availableCapacity();
    const ratio = cap > 0 ? used / cap : 0;
    const resRatio = cap > 0 ? reserved / cap : 0;
    const fillCls = (ratio + resRatio) >= 1 ? "full" : (ratio + resRatio) >= 0.8 ? "warn" : "";
    const invVal = GameState.inventoryValue();
    const invCost = GameState.inventoryCost();
    const pl = Utils.round2(invVal - invCost);

    let html = '<div class="card">' +
      '<div class="rowBetween">' +
        '<div><div class="muted3">DEPODA</div>' +
        '<div class="big num">' + Utils.qty(used) + ' <span class="muted">/ ' + Utils.qty(cap) + ' ton</span></div></div>' +
        '<div style="text-align:right"><div class="muted3">DOLULUK</div>' +
        '<div class="big num">' + Math.round((ratio + resRatio) * 100) + '%</div></div>' +
      '</div>' +
      '<div class="capBar split">' +
        '<div class="capFill ' + fillCls + '" style="width:' + Utils.clamp(ratio * 100, 0, 100) + '%"></div>' +
        '<div class="capFill reserved" style="width:' + Utils.clamp(resRatio * 100, 0, 100 - ratio * 100) + '%"></div>' +
      '</div>' +
      '<div class="capLegend">' +
        '<div class="kv"><div class="k">Yolda</div><div class="v num">' + Utils.qty(reserved) + ' ton</div></div>' +
        '<div class="kv"><div class="k">Rezerve</div><div class="v num">' + Utils.qty(reserved) + ' ton</div></div>' +
        '<div class="kv"><div class="k">Kullanılabilir</div><div class="v num ' + (avail <= 0 ? "down" : "") + '">' +
          Utils.qty(avail) + ' ton</div></div>' +
        '<div class="kv"><div class="k">Stok Değeri</div><div class="v num">' + Utils.money(invVal) + '</div></div>' +
        '<div class="kv"><div class="k">Açık K/Z</div><div class="v num ' + (pl > 0 ? "up" : pl < 0 ? "down" : "") + '">' + Utils.moneySigned(pl) + '</div></div>' +
        '<div class="kv"><div class="k">Yoldaki Değer</div><div class="v num">' + Utils.money(GameState.inTransitValue()) + '</div></div>' +
      '</div>' +
    '</div>';

    // Yoldaki mallar (özet; detay Tedarik ekranında)
    if (GameState.data.purchaseOrders.length) {
      const byProduct = {};
      GameState.data.purchaseOrders.forEach((o) => {
        if (!byProduct[o.product]) byProduct[o.product] = { qty: 0, soon: o.daysLeft };
        byProduct[o.product].qty += o.qty;
        byProduct[o.product].soon = Math.min(byProduct[o.product].soon, o.daysLeft);
      });
      html += '<div class="sectionTitle"><h2>Yoldaki Mallar</h2>' +
        '<span class="hint">' + GameState.data.purchaseOrders.length + ' sipariş</span></div>';
      html += Object.keys(byProduct).map((id) => {
        const pr = GameState.product(id);
        const row = byProduct[id];
        return '<div class="poCard" data-action="goto" data-tab="trades" data-seg="supply" role="button">' +
          '<div class="poTop">' + this.productIcon(pr) +
            '<div style="flex:1;min-width:0"><div class="poName">' + pr.name + '</div>' +
            '<div class="poSub num">' + Utils.qty(row.qty) + ' ton yolda</div></div>' +
            '<span class="lead' + (row.soon <= 1 ? " fast" : "") + '">' + row.soon + ' GÜN</span>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    const held = CONFIG.PRODUCTS.filter((p) => s.inventory[p.id].qty > 0);
    html += '<div class="sectionTitle"><h2>Stoklar</h2><span class="hint">' + held.length + ' ürün</span></div>';

    if (!held.length) {
      html += '<div class="empty"><div class="ic">📦</div>' +
        '<div class="t">Depo boş</div>' +
        '<div class="s">Piyasadan ürün satın alarak başla.</div>' +
        '<button class="btn primary sm" style="margin-top:14px;max-width:200px;margin-left:auto;margin-right:auto" data-action="goto" data-tab="market">PİYASAYA GİT</button>' +
      '</div>';
    } else {
      html += held.map((p) => {
        const h = s.inventory[p.id];
        const price = GameState.price(p.id);
        const val = Utils.round2(h.qty * price);
        const gain = InventorySystem.unrealized(p.id);
        const gpct = InventorySystem.unrealizedPct(p.id);
        const cls = gain > 0 ? "up" : gain < 0 ? "down" : "";
        return '<div class="holdRow" role="button" data-action="sell" data-id="' + p.id + '">' +
          '<div class="holdTop">' +
            this.productIcon(p) +
            '<div><div class="holdName">' + p.name + '</div>' +
            '<div class="holdQty num">' + Utils.qty(h.qty) + ' ' + p.unit + ' · ' + Utils.price(price) + '</div></div>' +
            '<div class="holdVal"><div class="v num">' + Utils.money(val) + '</div>' +
            '<div class="p num ' + cls + '">' + Utils.moneySigned(gain) + ' (' + Utils.pct(gpct) + ')</div></div>' +
          '</div>' +
          '<div class="holdGrid">' +
            '<div class="kv"><div class="k">Ort. Maliyet</div><div class="v num">' + Utils.price(h.avgCost) + '</div></div>' +
            '<div class="kv"><div class="k">Güncel Fiyat</div><div class="v num">' + Utils.price(price) + '</div></div>' +
          '</div>' +
          (GameState.committed(p.id) > 0
            ? '<div class="warnLine soft" style="margin-top:10px">Bu üründen ' +
              Utils.qty(GameState.committed(p.id)) + ' ton sözleşme taahhüdü var · serbest stok ' +
              Utils.qty(GameState.freeStock(p.id)) + ' ton</div>'
            : "") +
          '<div class="mktBtns">' +
            '<button class="btn sell" data-action="sell" data-id="' + p.id + '">SAT</button>' +
            '<button class="btn ghost" data-action="buy" data-id="' + p.id + '">EKLE</button>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    html += '<div class="sectionTitle" style="margin-top:18px"><h2>Depo Geliştirme</h2></div>';
    html += this.upgradeCardHTML();

    $("#screenWarehouse").innerHTML = html;
  },

  /* ---------------- bileşen: teslim tarihi rozeti ---------------- */
  deadlineChip(c) {
    if (c.status === "overdue") {
      return '<span class="dl danger">GECİKTİ · ' + c.graceLeft + ' gün</span>';
    }
    // daysLeft 0 => son teslim günü; hâlâ zamanında teslim edilebilir.
    if (c.daysLeft <= 0) return '<span class="dl danger">SON GÜN</span>';
    const cls = c.daysLeft === 1 ? "danger" : c.daysLeft === 2 ? "warn" : "";
    return '<span class="dl ' + cls + '">' + c.daysLeft + ' GÜN</span>';
  },

  /** Sözleşme süresinin cümle içinde okunabilir hâli. */
  deadlineText(c) {
    if (c.status === "overdue") return "Gecikmiş · telafi " + c.graceLeft + " gün";
    return c.daysLeft <= 0 ? "Son gün" : c.daysLeft + " gün";
  },

  /* ---------------- bileşen: teklif kartı ---------------- */
  offerCardHTML(o) {
    const p = GameState.product(o.product);
    const market = GameState.price(o.product);
    const h = GameState.holding(o.product);

    const have = Math.min(h.qty, o.qty);
    const need = o.qty - have;
    const costHeld = have * h.avgCost;
    const costBuy = need * market;
    const est = Utils.round2(o.value - costHeld - costBuy);
    const livePremium = market > 0 ? (o.unitPrice - market) / market : 0;

    const warns = [];
    if (need > GameState.freeCapacity()) {
      warns.push('<div class="warnLine">Depoda yer yok · ' +
        Utils.qty(need - GameState.freeCapacity()) + ' ton alan gerekiyor</div>');
    }
    if (costBuy > GameState.data.cash) {
      warns.push('<div class="warnLine soft">Eksiği bugünkü fiyattan almak için ' +
        Utils.money(costBuy - GameState.data.cash) + ' daha gerekiyor</div>');
    }
    if (!ContractSystem.hasSlot()) {
      warns.push('<div class="warnLine">Aktif sözleşme limiti dolu (' +
        ContractSystem.maxActive() + ') · itibar arttıkça limit yükselir</div>');
    }

    return '<div class="ctr">' +
      '<div class="ctrHead">' +
        this.productIcon(p) +
        '<div class="ctrWho"><div class="ctrCust">' + Utils.escape(o.customer) + '</div>' +
        '<div class="ctrSector">' + Utils.escape(o.sector) + '</div></div>' +
        '<span class="dl">' + o.days + ' GÜN</span>' +
      '</div>' +

      '<div class="ctrOrder">' +
        '<span class="ctrQty num">' + Utils.qty(o.qty) + ' ton</span>' +
        '<span class="ctrUnit">' + p.name + ' · ' + Utils.price(o.unitPrice) + '/ton</span>' +
        '<span class="ctrPrem ' + (livePremium >= 0 ? "" : "neg") + '">' +
          Utils.pct(livePremium) + ' piyasa</span>' +
      '</div>' +

      '<div class="ctrRows previewBox" style="margin:10px 0 0;border:0;background:transparent;padding:0">' +
        '<div class="pRow"><span class="k">Sözleşme tutarı</span><span class="v num">' + Utils.money(o.value) + '</span></div>' +
        (have > 0
          ? '<div class="pRow"><span class="k">Depodan karşılanan</span><span class="v num">' + Utils.qty(have) + ' ton</span></div>'
          : "") +
        '<div class="pRow"><span class="k">Bugünkü piyasa</span><span class="v num">' + Utils.price(market) + '/ton</span></div>' +
        '<div class="pRow"><span class="k">Tahmini brüt kâr</span><span class="v num ' +
          (est >= 0 ? "up" : "down") + '">' + Utils.moneySigned(est) + '</span></div>' +
        '<div class="pRow"><span class="k">Geç kalma cezası</span><span class="v num down">-' + Utils.money(o.penalty) + '</span></div>' +
      '</div>' +

      warns.join("") +

      '<div class="mktBtns">' +
        '<button class="btn ghost" data-action="offerReject" data-id="' + o.id + '">REDDET</button>' +
        '<button class="btn primary" data-action="offerAccept" data-id="' + o.id + '"' +
          (ContractSystem.hasSlot() ? "" : " disabled") + '>KABUL ET</button>' +
      '</div>' +
      '<div class="ctrFoot">' + (o.expiresIn <= 1
        ? "Son gün · bugün kabul edilebilir"
        : "Teklif " + o.expiresIn + " gün daha geçerli") + '</div>' +
    '</div>';
  },

  /* ---------------- bileşen: aktif sözleşme kartı ---------------- */
  contractCardHTML(c) {
    const p = GameState.product(c.product);
    const market = GameState.price(c.product);
    const h = GameState.holding(c.product);
    const have = Math.min(h.qty, c.qty);
    const need = c.qty - have;
    const ratio = c.qty > 0 ? have / c.qty : 0;
    const ready = need <= 0;

    const cls = c.status === "overdue" ? "overdue" : ready ? "ready" : (c.daysLeft <= 2 ? "warn" : "");
    const buyCost = Utils.round2(need * market);
    const incoming = GameState.inTransitQty(c.product);

    let note = "";
    if (c.status === "overdue") {
      note = '<div class="warnLine">Son gün geçti · ' + Utils.money(c.penalty) +
        ' ceza kesildi. ' + c.graceLeft + ' gün içinde teslim edersen ödemeyi yine alırsın.</div>';
    } else if (ready) {
      note = '<div class="warnLine soft" style="background:rgba(34,208,126,.1);border-color:rgba(34,208,126,.28);color:#7FE7B4">' +
        'Mal hazır · teslim edilebilir</div>';
    } else if (need > GameState.freeCapacity()) {
      note = '<div class="warnLine">Depo kapasitesi yetmiyor · ' +
        Utils.qty(need - GameState.freeCapacity()) + ' ton alan açman gerekiyor</div>';
    }

    return '<div class="ctr ' + cls + '">' +
      '<div class="ctrHead">' +
        this.productIcon(p) +
        '<div class="ctrWho"><div class="ctrCust">' + Utils.escape(c.customer) + '</div>' +
        '<div class="ctrSector">' + Utils.escape(c.sector) + '</div></div>' +

      '</div>' +

      '<div class="ctrOrder">' +
        '<span class="ctrQty num">' + Utils.qty(c.qty) + ' ton</span>' +
        '<span class="ctrUnit">' + p.name + ' · ' + Utils.price(c.unitPrice) + '/ton</span>' +
      '</div>' +

      '<div style="margin-top:10px">' +
        '<div class="rowBetween"><span class="muted">Depo</span>' +
        '<span class="muted num">' + Utils.qty(have) + ' / ' + Utils.qty(c.qty) + ' ton</span></div>' +
        '<div class="stockBar"><div class="stockFill' + (ready ? " full" : "") +
          '" style="width:' + (ratio * 100).toFixed(1) + '%"></div></div>' +
      '</div>' +

      '<div class="ctrRows previewBox" style="margin:8px 0 0;border:0;background:transparent;padding:0">' +

          ? '<div class="pRow"><span class="k">Eksik</span><span class="v num down">' + Utils.qty(need) +
