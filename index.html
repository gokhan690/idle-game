<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E14" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>Trade Empire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234C7DFF'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='27' font-weight='bold' fill='%23fff' text-anchor='middle'%3ETE%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   TRADE EMPIRE — V1
   Tek dosya. Framework yok. Mobil oncelikli.
   ============================================================ */

/* ---------- Tokens ---------- */
:root{
  --bg:#0A0E14;
  --bg-2:#0E141D;
  --surface:#141B26;
  --surface-2:#1A2231;
  --surface-3:#212B3B;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --text:#E9EFF8;
  --text-2:#93A1B5;
  --text-3:#66748A;
  --up:#22D07E;
  --up-dim:rgba(34,208,126,.14);
  --down:#FF5C7C;
  --down-dim:rgba(255,92,124,.14);
  --brand:#4C7DFF;
  --brand-2:#7A5CFF;
  --gold:#E9C46A;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  font-size:15px;
  line-height:1.4;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* ---------- App shell ---------- */
#app{
  position:relative;
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  max-width:560px;
  margin:0 auto;
  background:
    radial-gradient(120% 55% at 50% 0%, #16202D 0%, rgba(14,20,29,0) 60%),
    var(--bg);
  overflow:hidden;
}

/* ---------- Top bar ---------- */
.topbar{
  flex:0 0 auto;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:linear-gradient(180deg,rgba(20,27,38,.92),rgba(10,14,20,.72));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.brandRow{display:flex;align-items:center;gap:10px;}
.logo{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;
  background:linear-gradient(145deg,var(--brand),var(--brand-2));
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;letter-spacing:.5px;color:#fff;
  box-shadow:0 6px 16px rgba(76,125,255,.35);
}
.brandText{flex:1;min-width:0;}
.brandName{font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.1;}
.brandSub{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.3px;}
.dayChip{
  flex:0 0 auto;padding:7px 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-2);
  font-size:12.5px;font-weight:700;letter-spacing:.3px;color:var(--text-2);
}
.dayChip b{color:var(--text);}

.rankRow{
  display:flex;align-items:center;gap:8px;margin-top:10px;
  padding:7px 11px;border-radius:12px;
  background:linear-gradient(90deg,rgba(233,196,106,.14),rgba(233,196,106,.03));
  border:1px solid rgba(233,196,106,.22);
}
.rankRow .star{font-size:13px;line-height:1;}
.rankLabel{font-size:10.5px;font-weight:800;letter-spacing:.9px;color:rgba(233,196,106,.75);text-transform:uppercase;}
.rankName{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.2px;}

.statRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.statCard{
  padding:10px 12px;border-radius:15px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid var(--line-2);
  min-width:0;
}
.statCard .label{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:5px;
}
.statCard .value{
  margin-top:2px;font-size:20px;font-weight:800;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.statCard.gold .value{color:var(--gold);}
.statCard .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);}
.statCard.gold .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.flashUp{animation:flashUp .55s ease;}
.flashDown{animation:flashDown .55s ease;}
@keyframes flashUp{0%{color:var(--up);transform:translateY(-2px)}100%{}}
@keyframes flashDown{0%{color:var(--down);transform:translateY(2px)}100%{}}

/* ---------- Screens ---------- */
main{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:12px 16px 16px;
}
.screen{display:none;animation:fadeIn .22s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sectionTitle{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:2px 0 10px;
}
.sectionTitle h2{margin:0;font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);}
.sectionTitle .hint{font-size:12px;color:var(--text-3);font-weight:600;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
}

/* ---------- News ---------- */
.newsCard{
  position:relative;overflow:hidden;
  border-radius:var(--radius);
  padding:14px 14px 14px 16px;
  margin-bottom:12px;
  background:linear-gradient(135deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-2);
  animation:newsIn .4s cubic-bezier(.2,.9,.3,1);
}
@keyframes newsIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.newsCard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--brand);
}
.newsCard.pos::before{background:var(--up);}
.newsCard.neg::before{background:var(--down);}
.newsTop{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.newsTag{
  font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text-2);
}
.newsCard.pos .newsTag{background:var(--up-dim);color:var(--up);}
.newsCard.neg .newsTag{background:var(--down-dim);color:var(--down);}
.newsDay{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:700;}
.newsTitle{font-size:15px;font-weight:800;letter-spacing:-.1px;line-height:1.3;color:var(--text);}
.newsBody{margin-top:5px;font-size:13px;color:var(--text-2);line-height:1.45;}
.newsMeta{
  margin-top:9px;display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:var(--text-3);
  padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.05);
}

/* ---------- Market card ---------- */
.mkt{
  display:block;width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 13px;
  margin-bottom:10px;
  transition:transform .12s ease,border-color .2s ease,background .2s ease;
}
.mkt:active{transform:scale(.985);background:var(--surface-2);}
.mktTop{display:flex;align-items:flex-start;gap:11px;}
.mktIcon{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;letter-spacing:.3px;
  border:1px solid var(--line-2);
}
.mktNames{flex:1;min-width:0;}
.mktName{font-size:13px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-2);}
.mktPrice{margin-top:1px;font-size:21px;font-weight:800;letter-spacing:-.6px;}
.mktPrice small{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:0;margin-left:3px;}
.mktRight{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
.chg{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 9px;border-radius:9px;
  font-size:12.5px;font-weight:800;letter-spacing:.2px;
}
.chg.up{background:var(--up-dim);color:var(--up);}
.chg.down{background:var(--down-dim);color:var(--down);}
.chg.flat{background:rgba(255,255,255,.06);color:var(--text-2);}
.spark{display:block;}

.mktHold{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--text-2);font-weight:600;
}
.pill{
  padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.05);
  font-size:12px;font-weight:700;color:var(--text-2);
}
.pill b{color:var(--text);}
.pill.up{color:var(--up);background:var(--up-dim);}
.pill.down{color:var(--down);background:var(--down-dim);}

.mktBtns{display:flex;gap:9px;margin-top:10px;}

/* ---------- Buttons ---------- */
.btn{
  flex:1;height:46px;border-radius:13px;
  font-size:14px;font-weight:800;letter-spacing:.6px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s ease,opacity .2s ease,background .2s ease;
  background:var(--surface-3);color:var(--text);
  border:1px solid var(--line-2);
}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:linear-gradient(135deg,#4C7DFF,#6B5BFF);
  border:0;color:#fff;
  box-shadow:0 8px 22px rgba(76,125,255,.32);
}
.btn.sell{
  background:linear-gradient(135deg,#F0526F,#FF7A5C);
  border:0;color:#fff;
  box-shadow:0 8px 22px rgba(240,82,111,.28);
}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-2);}
.btn.gold{
  background:linear-gradient(135deg,#E9C46A,#D99A3A);
  border:0;color:#2A1D05;
  box-shadow:0 8px 22px rgba(233,196,106,.25);
}
.btn.danger{background:rgba(255,92,124,.12);border:1px solid rgba(255,92,124,.35);color:var(--down);}
.btn[disabled]{opacity:.4;pointer-events:none;}
.btn.sm{height:44px;font-size:13px;}

/* ---------- Day bar ---------- */
.dayBar{
  flex:0 0 auto;
  padding:8px 16px 8px;
  background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.9) 35%);
  border-top:1px solid transparent;
}
.dayBar.hidden{display:none;}
#nextDayBtn{
  width:100%;height:54px;border-radius:15px;
  background:linear-gradient(135deg,#3D6BFF,#7B4CFF);
  color:#fff;font-size:15.5px;font-weight:800;letter-spacing:1.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 26px rgba(76,125,255,.35);
  transition:transform .1s ease,box-shadow .2s ease;
}
#nextDayBtn:active{transform:scale(.975);box-shadow:0 4px 14px rgba(76,125,255,.3);}
#nextDayBtn.busy{opacity:.75;pointer-events:none;}

/* ---------- Tab bar ---------- */
.tabbar{
  flex:0 0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;padding:8px 6px calc(8px + var(--safe-b));
  background:rgba(12,17,24,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:7px 2px 6px;border-radius:12px;
  color:var(--text-3);
  transition:color .18s ease,background .18s ease;
  min-height:52px;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:.2px;}
.tab.active{color:var(--brand);background:rgba(76,125,255,.1);}
.tab:active{transform:scale(.94);}

/* ---------- Warehouse ---------- */
.capBar{height:10px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px;}
.capFill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,#4C7DFF,#7A5CFF);
  transition:width .5s cubic-bezier(.2,.9,.3,1);
}
.capFill.warn{background:linear-gradient(90deg,#E9C46A,#F0876A);}
.capFill.full{background:linear-gradient(90deg,#F0526F,#FF7A5C);}
.rowBetween{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.big{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.muted{color:var(--text-2);font-size:12.5px;font-weight:600;}
.muted3{color:var(--text-3);font-size:12px;font-weight:600;}

.holdRow{
  display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 13px;margin-bottom:10px;
  transition:transform .12s ease,background .2s ease;
}
.holdRow:active{transform:scale(.985);background:var(--surface-2);}
.holdTop{display:flex;align-items:center;gap:11px;}
.holdName{font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.holdQty{font-size:12.5px;color:var(--text-3);font-weight:700;margin-top:1px;}
.holdVal{margin-left:auto;text-align:right;}
.holdVal .v{font-size:17px;font-weight:800;letter-spacing:-.2px;}
.holdVal .p{font-size:12.5px;font-weight:800;margin-top:1px;}
.holdGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
}
.kv .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);}
.kv .v{font-size:14px;font-weight:700;margin-top:2px;}
.up{color:var(--up);}
.down{color:var(--down);}

.empty{
  text-align:center;padding:34px 18px;color:var(--text-3);
}
.empty .ic{font-size:30px;opacity:.5;margin-bottom:8px;}
.empty .t{font-size:14px;font-weight:700;color:var(--text-2);}
.empty .s{font-size:12.5px;margin-top:4px;}

/* ---------- Upgrade ---------- */
.upgCard{
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-2);border-radius:var(--radius);
  padding:15px;margin-bottom:12px;
}
.lvlDots{display:flex;gap:6px;margin-top:9px;}
.lvlDot{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.09);}
.lvlDot.on{background:linear-gradient(90deg,#4C7DFF,#7A5CFF);}

/* ---------- History ---------- */
.txRow{
  display:flex;align-items:center;gap:11px;
  padding:12px 13px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);
  margin-bottom:9px;
}
.txIcon{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;
}
.txIcon.buy{background:rgba(76,125,255,.14);color:#7FA3FF;}
.txIcon.sell{background:var(--up-dim);color:var(--up);}
.txIcon.upg{background:rgba(233,196,106,.14);color:var(--gold);}
.txMain{flex:1;min-width:0;}
.txTitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txSub{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:1px;}
.txAmt{text-align:right;flex:0 0 auto;}
.txAmt .a{font-size:14px;font-weight:800;}
.txAmt .b{font-size:11.5px;font-weight:700;margin-top:1px;}

/* ---------- Company ---------- */
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.statBox{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 13px;
}
.statBox .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);}
.statBox .v{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.2px;}
.progWrap{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px;}
.progFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#E9C46A,#D99A3A);transition:width .6s ease;}

.tierList{margin-top:4px;}
.tierRow{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line);
}
.tierRow:last-child{border-bottom:0;}
.tierBadge{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;
  background:rgba(255,255,255,.06);color:var(--text-3);
}
.tierRow.on .tierBadge{background:linear-gradient(145deg,#E9C46A,#D99A3A);color:#2A1D05;}
.tierRow.on .tierName{color:var(--gold);}
.tierName{font-size:13.5px;font-weight:700;}
.tierReq{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:700;}

/* ---------- Settings row ---------- */
.setRow{
  display:flex;align-items:center;gap:12px;
  padding:14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);
  margin-bottom:10px;width:100%;text-align:left;
}
.setRow .t{flex:1;min-width:0;}
.setRow .t .a{font-size:14.5px;font-weight:700;}
.setRow .t .b{font-size:12px;color:var(--text-3);font-weight:600;margin-top:2px;}
.switch{
  width:50px;height:30px;border-radius:999px;flex:0 0 auto;
  background:rgba(255,255,255,.1);position:relative;transition:background .22s ease;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .22s cubic-bezier(.2,.9,.3,1);
}
.switch.on{background:linear-gradient(135deg,#4C7DFF,#6B5BFF);}
.switch.on::after{transform:translateX(20px);}

/* ---------- Bottom sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:60;
  background:rgba(4,7,11,.66);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .26s ease;
}
.backdrop.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-width:560px;margin:0 auto;
  background:var(--bg-2);
  border-top-left-radius:26px;border-top-right-radius:26px;
  border-top:1px solid var(--line-2);
  box-shadow:0 -14px 40px rgba(0,0,0,.55);
  padding:8px 16px calc(18px + var(--safe-b));
  transform:translateY(102%);
  transition:transform .3s cubic-bezier(.22,.95,.3,1);
  max-height:88dvh;overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.grabber{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.18);margin:6px auto 14px;}

.shHead{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.shName{font-size:17px;font-weight:800;letter-spacing:-.2px;}
.shSub{font-size:12.5px;color:var(--text-3);font-weight:700;margin-top:1px;}
.shTag{
  margin-left:auto;padding:6px 11px;border-radius:9px;
  font-size:11px;font-weight:800;letter-spacing:1px;
}
.shTag.buy{background:rgba(76,125,255,.16);color:#8FAEFF;}
.shTag.sell{background:var(--down-dim);color:var(--down);}

.qtyChips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px;}
.chip{
  height:46px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line-2);
  font-size:13px;font-weight:800;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  transition:all .16s ease;
}
.chip.active{background:linear-gradient(135deg,#4C7DFF,#6B5BFF);border-color:transparent;color:#fff;}
.chip:active{transform:scale(.94);}
.chip[disabled]{opacity:.3;pointer-events:none;}

.stepper{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:8px 10px;margin-bottom:12px;
}
.stepBtn{
  width:44px;height:44px;border-radius:11px;flex:0 0 auto;
  background:var(--surface-3);border:1px solid var(--line-2);
  font-size:21px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
.stepBtn:active{transform:scale(.92);}
.stepBtn[disabled]{opacity:.3;pointer-events:none;}
.stepVal{flex:1;text-align:center;}
.stepVal .n{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.stepVal .u{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--text-3);text-transform:uppercase;}

.previewBox{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:6px 13px;margin-bottom:13px;
}
.pRow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.pRow:last-child{border-bottom:0;}
.pRow .k{color:var(--text-2);font-weight:600;}
.pRow .v{font-weight:800;}
.pRow.total .k{color:var(--text);font-weight:800;}
.pRow.total .v{font-size:16px;}
.shErr{
  text-align:center;font-size:12.5px;font-weight:700;color:var(--down);
  margin-bottom:10px;min-height:16px;
}
.shErr:empty{display:none;}

/* ---------- FX / feedback ---------- */
#fxLayer{position:fixed;inset:0;z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.fxPop{
  text-align:center;
  animation:fxPop 1.5s cubic-bezier(.16,.9,.3,1) forwards;
  text-shadow:0 6px 30px rgba(0,0,0,.6);
}
.fxPop .a{font-size:44px;font-weight:900;letter-spacing:-1.4px;line-height:1;}
.fxPop .b{font-size:13px;font-weight:800;letter-spacing:3px;margin-top:7px;opacity:.9;}
.fxPop.up{color:var(--up);}
.fxPop.down{color:var(--down);}
.fxPop.neutral{color:#9FB3D0;}
@keyframes fxPop{
  0%{opacity:0;transform:scale(.6) translateY(20px);}
  18%{opacity:1;transform:scale(1.06) translateY(0);}
  30%{transform:scale(1);}
  72%{opacity:1;transform:scale(1) translateY(-14px);}
  100%{opacity:0;transform:scale(.97) translateY(-46px);}
}

#toastLayer{
  position:fixed;left:0;right:0;top:calc(var(--safe-t) + 10px);z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;padding:0 16px;
}
.toast{
  max-width:100%;
  padding:11px 16px;border-radius:13px;
  background:rgba(28,37,50,.97);
  border:1px solid var(--line-2);
  box-shadow:var(--shadow);
  font-size:13.5px;font-weight:700;
  animation:toastIn .3s cubic-bezier(.2,.9,.3,1);
}
.toast.err{border-color:rgba(255,92,124,.4);color:#FF9AAF;}
.toast.ok{border-color:rgba(34,208,126,.4);color:#7FE7B4;}
.toast.out{animation:toastOut .28s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.97)}}

/* ---------- Day transition ---------- */
#dayFlash{
  position:fixed;inset:0;z-index:70;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,18,.55);opacity:0;
}
#dayFlash.go{animation:dayFlash .85s ease forwards;}
#dayFlash .t{font-size:30px;font-weight:900;letter-spacing:2px;color:#fff;}
@keyframes dayFlash{
  0%{opacity:0}
  25%{opacity:1}
  70%{opacity:1}
  100%{opacity:0}
}


/* ---------- İtibar (üst bar) ---------- */
.repBox{margin-left:auto;text-align:right;min-width:96px;}
.repTrack{height:5px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px;}
.repFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#E9C46A,#D99A3A);transition:width .5s cubic-bezier(.2,.9,.3,1);}
.repFill.low{background:linear-gradient(90deg,#F0526F,#FF7A5C);}
.repFill.high{background:linear-gradient(90deg,#22D07E,#5FE0A8);}

/* ---------- Sekme rozeti ---------- */
.tab{position:relative;}
.badge{
  position:absolute;top:3px;left:50%;margin-left:6px;
  min-width:17px;height:17px;padding:0 5px;border-radius:999px;
  background:linear-gradient(135deg,#F0526F,#FF7A5C);
  color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;
  box-shadow:0 2px 8px rgba(240,82,111,.5);
}
.badge[hidden]{display:none;}

/* ---------- Segment kontrolü ---------- */
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:4px;margin-bottom:14px;
}
.segBtn{
  height:44px;border-radius:11px;
  font-size:12.5px;font-weight:800;letter-spacing:.3px;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .18s ease,color .18s ease;
}
.segBtn.active{background:var(--surface-3);color:var(--text);}
.segBtn:active{transform:scale(.96);}
.segBtn .n{
  min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:rgba(255,255,255,.1);font-size:10.5px;line-height:18px;
}
.segBtn.active .n{background:var(--brand);color:#fff;}
.segBtn.alert .n{background:linear-gradient(135deg,#F0526F,#FF7A5C);color:#fff;}

/* ---------- Sözleşme / teklif kartı ---------- */
.ctr{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px;margin-bottom:12px;
}
.ctr.ready{border-color:rgba(34,208,126,.4);}
.ctr.warn{border-color:rgba(233,196,106,.4);}
.ctr.overdue{border-color:rgba(255,92,124,.45);background:linear-gradient(160deg,rgba(255,92,124,.07),var(--surface));}
.ctr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.ctr.ready::before{background:var(--up);}
.ctr.warn::before{background:var(--gold);}
.ctr.overdue::before{background:var(--down);}

.ctrHead{display:flex;align-items:flex-start;gap:11px;}
.ctrWho{flex:1;min-width:0;}
.ctrCust{font-size:14.5px;font-weight:800;letter-spacing:-.1px;line-height:1.25;}
.ctrSector{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:2px;}
.dl{
  flex:0 0 auto;padding:5px 9px;border-radius:9px;
  font-size:11.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap;
  background:rgba(255,255,255,.07);color:var(--text-2);
}
.dl.warn{background:rgba(233,196,106,.16);color:var(--gold);}
.dl.danger{background:var(--down-dim);color:var(--down);}
.dl.ok{background:var(--up-dim);color:var(--up);}

.ctrOrder{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
}
.ctrQty{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.ctrUnit{font-size:13px;font-weight:700;color:var(--text-2);}
.ctrPrem{
  margin-left:auto;padding:4px 8px;border-radius:8px;
  font-size:11.5px;font-weight:800;background:var(--up-dim);color:var(--up);
}
.ctrPrem.neg{background:var(--down-dim);color:var(--down);}

.ctrRows{margin-top:10px;padding-top:4px;border-top:1px solid var(--line);}
.ctrFoot{
  margin-top:9px;font-size:11.5px;color:var(--text-3);font-weight:600;text-align:center;
}
.stockBar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;}
.stockFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#4C7DFF,#7A5CFF);transition:width .45s ease;}
.stockFill.full{background:linear-gradient(90deg,#22D07E,#5FE0A8);}
.warnLine{
  display:flex;align-items:center;gap:7px;
  margin-top:10px;padding:9px 11px;border-radius:11px;
  background:rgba(255,92,124,.1);border:1px solid rgba(255,92,124,.25);
  font-size:12.5px;font-weight:700;color:#FF9AAF;line-height:1.35;
}
.warnLine.soft{background:rgba(233,196,106,.1);border-color:rgba(233,196,106,.25);color:#EBD08A;}

/* ---------- Tedarik ---------- */
.seg.four{grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;}
.seg.four .segBtn{font-size:11.5px;letter-spacing:0;gap:4px;padding:0 2px;}
.seg.four .segBtn .n{min-width:16px;height:16px;padding:0 4px;font-size:9.5px;line-height:16px;}

.pSel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:13px;}
.pBtn{
  height:46px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:background .18s ease,border-color .18s ease;
}
.pBtn .t{font-size:12px;font-weight:800;color:var(--text-2);letter-spacing:.2px;}
.pBtn .p{font-size:10.5px;font-weight:700;color:var(--text-3);}
.pBtn.active{background:var(--surface-3);border-color:var(--line-2);}
.pBtn.active .t{color:var(--text);}
.pBtn:active{transform:scale(.96);}

.supCard{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px;margin-bottom:11px;
}
.supCard.spot{background:linear-gradient(150deg,rgba(76,125,255,.10),var(--surface));border-color:rgba(76,125,255,.28);}
.supHead{display:flex;align-items:flex-start;gap:10px;}
.supName{font-size:14.5px;font-weight:800;letter-spacing:-.1px;line-height:1.25;}
.supDesc{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:2px;}
.lead{
  flex:0 0 auto;padding:5px 9px;border-radius:9px;white-space:nowrap;
  font-size:11.5px;font-weight:800;background:rgba(255,255,255,.07);color:var(--text-2);
}
.lead.fast{background:rgba(76,125,255,.16);color:#8FAEFF;}
.lead.slow{background:rgba(233,196,106,.14);color:var(--gold);}

.supPrice{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
}
.supPrice .v{font-size:21px;font-weight:800;letter-spacing:-.5px;}
.supPrice .u{font-size:12px;font-weight:700;color:var(--text-3);}
.dlt{
  margin-left:auto;padding:4px 8px;border-radius:8px;
  font-size:11.5px;font-weight:800;background:var(--up-dim);color:var(--up);
}
.dlt.up{background:var(--down-dim);color:var(--down);}
.dlt.flat{background:rgba(255,255,255,.06);color:var(--text-2);}

.fitLine{
  display:flex;align-items:center;gap:7px;
  margin-top:10px;padding:9px 11px;border-radius:11px;
  font-size:12.5px;font-weight:700;line-height:1.35;
}
.fitLine.ok{background:rgba(34,208,126,.1);border:1px solid rgba(34,208,126,.28);color:#7FE7B4;}
.fitLine.grace{background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.28);color:#EBD08A;}
.fitLine.late{background:rgba(255,92,124,.1);border:1px solid rgba(255,92,124,.28);color:#FF9AAF;}

.poCard{
  background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:12px;margin-bottom:10px;
}
.poTop{display:flex;align-items:center;gap:10px;}
.poName{font-size:13.5px;font-weight:800;}
.poSub{font-size:11.5px;color:var(--text-3);font-weight:700;margin-top:2px;}
.poBar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px;}
.poFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#4C7DFF,#7A5CFF);transition:width .5s ease;}

/* depo kapasite çubuğu: kullanılan + rezerve */
.capBar.split{display:flex;}
.capFill.reserved{
  background:repeating-linear-gradient(45deg,rgba(233,196,106,.75) 0 5px,rgba(233,196,106,.35) 5px 10px);
}
.capLegend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}

/* ---------- İtibar kartı (Şirket) ---------- */
.repCard{
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-2);border-radius:var(--radius);padding:15px;margin-bottom:12px;
}
.repBig{font-size:30px;font-weight:800;letter-spacing:-1px;}
.repScale{display:flex;gap:5px;margin-top:10px;}
.repStep{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.09);}
.repStep.on{background:linear-gradient(90deg,#E9C46A,#D99A3A);}

@media (max-width:340px){
  .statCard .value{font-size:18px;}
  .mktPrice{font-size:20px;}
  .tab span{font-size:9.5px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>

<script>
"use strict";
/* ============================================================================
 * TRADE EMPIRE — V1
 * ----------------------------------------------------------------------------
 * Mimari, ileride yeni sistemler (ülkeler, lojistik, çalışanlar, fabrikalar,
 * banka/kredi, rakip şirketler, uluslararası ticaret) eklenebilecek şekilde
 * bağımsız modüllere ayrılmıştır:
 *
 *   CONFIG           -> Tüm oyun dengesi / sabitler (veri odaklı)
 *   Utils            -> Yardımcılar (format, rng, dom)
 *   GameState        -> Tek doğruluk kaynağı (state) + türetilmiş değerler
 *   MarketSystem     -> Fiyat modeli (mean-reversion + volatilite + event)
 *   InventorySystem  -> Stok + ağırlıklı ortalama maliyet
 *   TradingSystem    -> Al/Sat işlemleri + işlem kaydı
 *   EventSystem      -> Haber/olay üretimi ve piyasa etkisi
 *   CompanySystem    -> Ünvan/seviye + depo yükseltmeleri
 *   SaveSystem       -> localStorage kalıcılığı
 *   Audio            -> Basit WebAudio geri bildirimi
 *   UI               -> Render + etkileşim (ekranlar, sheet, efektler)
 *   Game             -> Akış kontrolü (init, gün ilerletme)
 *
 * Yeni bir sistem eklemek için: CONFIG'e veri, ilgili System modülüne mantık,
 * UI.screens'e ekran ekleyin. Modüller birbirine sadece public API üzerinden
 * bağlıdır.
 * ==========================================================================*/

/* ===========================================================================
 * CONFIG
 * =========================================================================*/
const CONFIG = {

    },

      color: "#F2A177", bg: "rgba(242,161,119,.12)"
    },
    {
      id: "wheat", name: "Buğday", code: "WH", unit: "ton",
      base: 240, min: 100, max: 560,
      volatility: 0.110, momentum: 0.026, reversion: 0.24,
      color: "#E9CE6A", bg: "rgba(233,206,106,.12)"
    }
  ],

  /* Depo seviyeleri: index 0 = seviye 1 */
  WAREHOUSE: [
    { level: 1, capacity: 100, upgradeCost: 25000 },
    { level: 2, capacity: 250, upgradeCost: 120000 },
    { level: 3, capacity: 500, upgradeCost: null }
  ],

  /* Şirket değerine göre ünvanlar */
  TITLES: [
    { min: 0,      name: "Küçük Tüccar" },
    { min: 25000,  name: "Toptancı" },
    { min: 100000, name: "Bölgesel Trader" },
    { min: 500000, name: "İthalatçı" }
  ],

  MARKET: {
    MOMENTUM_DECAY: 0.80, // trendin gün gün korunma oranı (AR(1))

    NEWS_FEED_LEN: 12,    // ticaret/haber akışında saklanan haber sayısı

  },

  EVENTS: {

    MIN_DAYS: 1,
    MAX_DAYS: 3,
    POOL: [
      { id:"cu_strike", product:"copper", dir:1, power:[0.045,0.085],
        title:"Büyük bakır madeninde üretim durdu",

      { id:"cu_demand", product:"copper", dir:1, power:[0.035,0.07],
